<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보 게임</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}   

.game {
    width: 90%;
    max-width: 700px;
    background: white;
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
    font-size: 36px;
}

/* ==========================
   이름 설정
========================== */

#nameScreen h2 {
    margin-bottom: 25px;
}

.name-input {
    width: 80%;
    padding: 15px;
    margin: 8px 0;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    outline: none;
    text-align: center;
}

.name-input:focus {
    border-color: #667eea;
}

#startButton {
    margin-top: 15px;
    width: 80%;
    background: #667eea;
}

/* ==========================
   난이도
========================== */

.difficulty-title {
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

.difficulty-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 80%;
    margin: 0 auto;
}

.difficulty-option {
    flex: 1;
}

.difficulty-option input {
    display: none;
}

.difficulty-option label {
    display: block;
    padding: 12px 5px;
    border: 2px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
    color: #555;
}

.difficulty-option label:hover {
    border-color: #667eea;
}

.difficulty-option input:checked + label {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

/* ==========================
   게임 화면
========================== */

#gameScreen {
    display: none;
}

.difficulty-display {
    display: inline-block;
    padding: 7px 15px;
    margin-bottom: 10px;
    border-radius: 20px;
    background: #f1f3f5;
    color: #555;
    font-weight: bold;
}

/* ==========================
   봇 상태
========================== */

.bot-status {
    margin: 10px auto 15px;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

.bot-status.active {
    background: #e8f5e9;
    color: #2e7d32;
}

.bot-status.inactive {
    background: #f5f5f5;
    color: #777;
}

#botThinking {
    min-height: 24px;
    margin: 5px 0;
    color: #667eea;
    font-weight: bold;
}

/* ==========================
   점수
========================== */

.score {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 25px 0;
    font-size: 20px;
}

.score-box {
    background: #f1f3f5;
    padding: 15px 25px;
    border-radius: 15px;
    min-width: 130px;
}

.score-box strong {
    font-size: 38px;
    color: #667eea;
}

/* ==========================
   대결
========================== */

.battle {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 30px 0;
}

.player,
.computer {
    font-size: 18px;
    font-weight: bold;
}

.choice {
    font-size: 70px;
    margin-top: 10px;
}

.vs {
    font-size: 25px;
    font-weight: bold;
}

/* ==========================
   버튼
========================== */

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 25px 0;
}

button {
    border: none;
    border-radius: 15px;
    padding: 15px 20px;
    font-size: 18px;
    cursor: pointer;
    background: #667eea;
    color: white;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: translateY(-4px);
    background: #5568d8;
}

button:active:not(:disabled) {
    transform: scale(0.95);
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* ==========================
   결과
========================== */

#result {
    font-size: 23px;
    font-weight: bold;
    min-height: 40px;
    line-height: 1.5;
}

/* ==========================
   아이템
========================== */

.item-section {
    margin-top: 25px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 18px;
    border: 2px solid #eee;
}

.item-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 8px;
}

.item-rule {
    color: #777;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 15px;
}

.item-list {
    display: flex;
    gap: 10px;
}

.item-card {
    flex: 1;
    padding: 12px 5px;
    background: white;
    color: #333;
    border: 2px solid #ddd;
    border-radius: 12px;
}

.item-card:hover:not(:disabled) {
    background: white;
    border-color: #667eea;
}

.item-card.active {
    border-color: #ff8c00;
    background: #fff4e6;
}

.item-icon {
    font-size: 30px;
}

.item-name {
    margin-top: 5px;
    font-size: 14px;
    font-weight: bold;
}

.item-count {
    margin-top: 5px;
    color: #667eea;
    font-size: 14px;
    font-weight: bold;
}

.active-items {
    min-height: 24px;
    margin-top: 12px;
    color: #ff7a00;
    font-size: 14px;
    font-weight: bold;
}

/* ==========================
   봇 버튼
========================== */

.bot-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.bot-buttons button {
    flex: 1;
}

#botStart {
    background: #4caf50;
}

#botStop {
    background: #f44336;
}

/* ==========================
   하단 버튼
========================== */

#reset {
    margin-top: 15px;
    background: #343a40;
}

#changeName {
    margin-top: 10px;
    background: #868e96;
}

.max-score {
    margin-top: 15px;
    color: #888;
    font-size: 13px;
}

/* ==========================
   게임 종료
========================== */

#gameOver {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: #fff3cd;
    color: #856404;
    font-size: 20px;
    font-weight: bold;
}

/* ==========================
   아이템 획득 알림
========================== */

#itemNotification {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    width: 320px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 9999;
}

#itemNotification.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.notification-icon {
    font-size: 55px;
}

.notification-title {
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
}

.notification-text {
    margin-top: 8px;
    color: #666;
    line-height: 1.5;
}

/* ==========================
   모바일
========================== */

@media(max-width: 500px) {

    .game {
        padding: 20px;
    }

    .difficulty-group {
        flex-direction: column;
    }

    .choice {
        font-size: 55px;
    }

    .score {
        gap: 10px;
    }

    .score-box {
        min-width: 110px;
        padding: 12px;
    }

    .item-list {
        flex-direction: column;
    }

    .buttons button {
        padding: 12px;
        font-size: 16px;
    }
}

</style>
</head>


<body>

<div class="game">

    <!-- ==========================
         이름 설정 화면
    ========================== -->

    <div id="nameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <h2>게임 이름 설정</h2>

        <input
            type="text"
            id="playerNameInput"
            class="name-input"
            placeholder="내 이름"
            maxlength="20"
        >

        <br>

        <input
            type="text"
            id="opponentNameInput"
            class="name-input"
            placeholder="상대방 이름"
            maxlength="20"
        >

        <br>


        <div class="difficulty-title">
            🎮 난이도 선택
        </div>


        <div class="difficulty-group">

            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="easy"
                    value="easy"
                    checked
                >

                <label for="easy">
                    🟢 쉬움
                </label>

            </div>


            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="normal"
                    value="normal"
                >

                <label for="normal">
                    🟡 보통
                </label>

            </div>


            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="hard"
                    value="hard"
                >

                <label for="hard">
                    🔴 어려움
                </label>

            </div>

        </div>


        <button
            id="startButton"
            onclick="startGame()"
        >
            🎮 게임 시작
        </button>

    </div>


    <!-- ==========================
         게임 화면
    ========================== -->

    <div id="gameScreen">

        <h1>✊ 가위바위보 ✌️</h1>


        <div
            id="difficultyDisplay"
            class="difficulty-display"
        >
            🟢 쉬움
        </div>


        <div
            id="botStatus"
            class="bot-status inactive"
        >
            🤖 봇 플레이: 꺼짐
        </div>


        <!-- 점수 -->

        <div class="score">

            <div class="score-box">

                <span id="playerName">
                    플레이어
                </span>

                <br>

                <strong id="playerScore">
                    0
                </strong>

            </div>


            <div class="score-box">

                <span id="opponentName">
                    컴퓨터
                </span>

                <br>

                <strong id="computerScore">
                    0
                </strong>

            </div>

        </div>


        <!-- 대결 -->

        <div class="battle">

            <div class="player">

                <div id="playerNameBattle">
                    플레이어
                </div>

                <div
                    class="choice"
                    id="playerChoice"
                >
                    ❔
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="computer">

                <div id="opponentNameBattle">
                    컴퓨터
                </div>

                <div
                    class="choice"
                    id="computerChoice"
                >
                    ❔
                </div>

            </div>

        </div>


        <div id="botThinking"></div>


        <!-- 결과 -->

        <div id="result">
            아래에서 선택하세요!
        </div>


        <!-- 선택 버튼 -->

        <div class="buttons">

            <button onclick="play('rock')">
                ✊ 바위
            </button>

            <button onclick="play('paper')">
                ✋ 보
            </button>

            <button onclick="play('scissors')">
                ✌️ 가위
            </button>

        </div>


        <!-- ==========================
             아이템
        ========================== -->

        <div class="item-section">

            <div class="item-title">
                🎁 아이템
            </div>


            <div class="item-rule">
                <strong>25점 / 50점 / 75점</strong> 달성 시
                <strong>아이템 종류와 개수가 랜덤</strong>으로 지급됩니다.<br>
                아이템 개수는 <strong>1~5개</strong> 중 랜덤으로 결정됩니다.
            </div>


            <div class="item-list">

                <button
                    class="item-card"
                    id="shieldItem"
                    onclick="useItem('shield')"
                >

                    <div class="item-icon">
                        🛡️
                    </div>

                    <div class="item-name">
                        방어막
                    </div>

                    <div
                        class="item-count"
                        id="shieldCount"
                    >
                        0개
                    </div>

                </button>


                <button
                    class="item-card"
                    id="doubleItem"
                    onclick="useItem('double')"
                >

                    <div class="item-icon">
                        ⚡
                    </div>

                    <div class="item-name">
                        점수 2배
                    </div>

                    <div
                        class="item-count"
                        id="doubleCount"
                    >
                        0개
                    </div>

                </button>


                <button
                    class="item-card"
                    id="luckyItem"
                    onclick="useItem('lucky')"
                >

                    <div class="item-icon">
                        🍀
                    </div>

                    <div class="item-name">
                        행운
                    </div>

                    <div
                        class="item-count"
                        id="luckyCount"
                    >
                        0개
                    </div>

                </button>

            </div>


            <div
                class="active-items"
                id="activeItems"
            ></div>

        </div>


        <!-- ==========================
             봇 플레이
        ========================== -->

        <div class="bot-buttons">

            <button
                id="botStart"
                onclick="startBot()"
            >
                🤖 봇 플레이 시작
            </button>


            <button
                id="botStop"
                onclick="stopBot()"
                disabled
            >
                ⏹️ 봇 플레이 중지
            </button>

        </div>


        <!-- ==========================
             기타
        ========================== -->

        <button
            id="reset"
            onclick="resetGame()"
        >
            🔄 게임 초기화
        </button>


        <br>


        <button
            id="changeName"
            onclick="changeName()"
        >
            ✏️ 이름 변경
        </button>


        <div class="max-score">
            🏆 먼저 100점을 달성하면 승리합니다.
        </div>


        <div id="gameOver"></div>

    </div>

</div>


<!-- ==========================
     아이템 획득 알림
========================== -->

<div id="itemNotification">

    <div
        class="notification-icon"
        id="notificationIcon"
    ></div>


    <div
        class="notification-title"
        id="notificationTitle"
    ></div>


    <div
        class="notification-text"
        id="notificationText"
    ></div>

</div>


<script>

/* ==========================
   기본 변수
========================== */

let playerScore = 0;

let computerScore = 0;

let playerName = "";

let opponentName = "";

let difficulty = "easy";

let playerHistory = [];


/* ==========================
   게임 설정
========================== */

const MAX_SCORE = 100;

const BOT_INTERVAL = 3500;

const BOT_THINK_TIME = 1200;


/* ==========================
   가위바위보
========================== */

const choices = {

    rock: "✊",

    paper: "✋",

    scissors: "✌️"

};


/* ==========================
   난이도 이름
========================== */

const difficultyNames = {

    easy: "🟢 쉬움",

    normal: "🟡 보통",

    hard: "🔴 어려움"

};


/* ==========================
   봇 변수
========================== */

let botTimer = null;

let botActionTimer = null;

let botPlaying = false;


/* ==========================
   아이템
========================== */

let items = {

    shield: 0,

    double: 0,

    lucky: 0

};


let activeItems = {

    shield: false,

    double: false,

    lucky: false

};


/*
    25 / 50 / 75점 보상은
    각각 한 번씩만 지급
*/

let earnedRewards = [];


/* ==========================
   아이템 정보
========================== */

const itemInfo = {

    shield: {

        icon: "🛡️",

        name: "방어막",

        description:
            "다음 패배를 1회 막습니다."

    },


    double: {

        icon: "⚡",

        name: "점수 2배",

        description:
            "다음 승리에서 2점을 얻습니다."

    },


    lucky: {

        icon: "🍀",

        name: "행운",

        description:
            "다음 무승부를 승리로 바꿉니다."

    }

};


/* ==========================
   랜덤 함수
========================== */

function randomChoice(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* ==========================
   게임 시작
========================== */

function startGame() {

    const playerInput =
        document.getElementById(
            "playerNameInput"
        );


    const opponentInput =
        document.getElementById(
            "opponentNameInput"
        );


    const player =
        playerInput.value.trim();


    const opponent =
        opponentInput.value.trim();


    if (player === "") {

        alert(
            "내 이름을 입력해주세요!"
        );

        playerInput.focus();

        return;

    }


    if (opponent === "") {

        alert(
            "상대방 이름을 입력해주세요!"
        );

        opponentInput.focus();

        return;

    }


    playerName = player;

    opponentName = opponent;


    const selectedDifficulty =
        document.querySelector(
            'input[name="difficulty"]:checked'
        );


    difficulty =
        selectedDifficulty
            ? selectedDifficulty.value
            : "easy";


    playerScore = 0;

    computerScore = 0;

    playerHistory = [];


    resetItems();

    stopBot();


    document.getElementById(
        "playerName"
    ).textContent =
        playerName;


    document.getElementById(
        "playerNameBattle"
    ).textContent =
        playerName;


    document.getElementById(
        "opponentName"
    ).textContent =
        opponentName;


    document.getElementById(
        "opponentNameBattle"
    ).textContent =
        opponentName;


    document.getElementById(
        "difficultyDisplay"
    ).textContent =
        difficultyNames[difficulty];


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "computerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "botThinking"
    ).textContent =
        "";


    enableGameButtons();


    document.getElementById(
        "nameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";

}


/* ==========================
   아이템 초기화
========================== */

function resetItems() {

    items = {

        shield: 0,

        double: 0,

        lucky: 0

    };


    activeItems = {

        shield: false,

        double: false,

        lucky: false

    };


    earnedRewards = [];


    updateItems();

}


/* ==========================
   아이템 표시 업데이트
========================== */

function updateItems() {

    document.getElementById(
        "shieldCount"
    ).textContent =
        items.shield + "개";


    document.getElementById(
        "doubleCount"
    ).textContent =
        items.double + "개";


    document.getElementById(
        "luckyCount"
    ).textContent =
        items.lucky + "개";


    const shieldButton =
        document.getElementById(
            "shieldItem"
        );


    const doubleButton =
        document.getElementById(
            "doubleItem"
        );


    const luckyButton =
        document.getElementById(
            "luckyItem"
        );


    shieldButton.disabled =
        items.shield <= 0 ||
        activeItems.shield;


    doubleButton.disabled =
        items.double <= 0 ||
        activeItems.double;


    luckyButton.disabled =
        items.lucky <= 0 ||
        activeItems.lucky;


    shieldButton.classList.toggle(
        "active",
        activeItems.shield
    );


    doubleButton.classList.toggle(
        "active",
        activeItems.double
    );


    luckyButton.classList.toggle(
        "active",
        activeItems.lucky
    );


    updateActiveItems();

}


/* ==========================
   활성 아이템 표시
========================== */

function updateActiveItems() {

    const active = [];


    if (activeItems.shield) {

        active.push(
            "🛡️ 방어막"
        );

    }


    if (activeItems.double) {

        active.push(
            "⚡ 점수 2배"
        );

    }


    if (activeItems.lucky) {

        active.push(
            "🍀 행운"
        );

    }


    document.getElementById(
        "activeItems"
    ).textContent =
        active.length > 0
            ? "✨ 사용 중: " + active.join(" / ")
            : "";

}


/* ==========================
   아이템 사용
========================== */

function useItem(itemType) {

    if (
        items[itemType] <= 0
    ) {

        return;

    }


    if (
        activeItems[itemType]
    ) {

        return;

    }


    items[itemType]--;


    activeItems[itemType] =
        true;


    updateItems();


    document.getElementById(
        "result"
    ).textContent =
        itemInfo[itemType].icon +
        " " +
        itemInfo[itemType].name +
        " 사용!";

}


/* ==========================
   아이템 보상 확인
========================== */

function checkItemRewards() {

    const milestones = [
        25,
        50,
        75
    ];


    milestones.forEach(
        function(score) {

            if (

                playerScore >= score &&

                !earnedRewards.includes(score)

            ) {

                earnedRewards.push(score);

                giveRandomItemReward(score);

            }

        }
    );

}


/* ==========================
   ★ 랜덤 아이템 보상
========================== */

function giveRandomItemReward(score) {

    /*
        세 가지 아이템 중 랜덤
    */

    const itemTypes = [

        "shield",

        "double",

        "lucky"

    ];


    const randomItem =
        randomChoice(itemTypes);


    /*
        1~5개 중 랜덤
    */

    const randomAmount =
        Math.floor(
            Math.random() * 5
        ) + 1;


    /*
        기존 보유량에 추가
    */

    items[randomItem] +=
        randomAmount;


    updateItems();


    showItemNotification(
        score,
        randomItem,
        randomAmount
    );

}


/* ==========================
   아이템 획득 알림
========================== */

function showItemNotification(
    score,
    itemType,
    amount
) {

    const notification =
        document.getElementById(
            "itemNotification"
        );


    document.getElementById(
        "notificationIcon"
    ).textContent =
        itemInfo[itemType].icon;


    document.getElementById(
        "notificationTitle"
    ).textContent =
        score +
        "점 달성! 🎉";


    document.getElementById(
        "notificationText"
    ).textContent =
        itemInfo[itemType].name +
        " " +
        amount +
        "개를 획득했습니다!";


    notification.classList.add(
        "show"
    );


    setTimeout(
        function() {

            notification.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* ==========================
   컴퓨터가 이기는 선택
========================== */

function getWinningChoice(choice) {

    if (
        choice === "rock"
    ) {

        return "paper";

    }


    if (
        choice === "paper"
    ) {

        return "scissors";

    }


    return "rock";

}


/* ==========================
   컴퓨터 선택
========================== */

function getComputerChoice() {

    const options = [

        "rock",

        "paper",

        "scissors"

    ];


    /* 쉬움 */

    if (
        difficulty === "easy"
    ) {

        return randomChoice(options);

    }


    /*
        처음에는 랜덤
    */

    if (
        playerHistory.length === 0
    ) {

        return randomChoice(options);

    }


    /* 보통 */

    if (
        difficulty === "normal"
    ) {

        const lastChoice =
            playerHistory[
                playerHistory.length - 1
            ];


        /*
            60% 랜덤
            40% 카운터
        */

        if (
            Math.random() < 0.6
        ) {

            return randomChoice(options);

        }


        return getWinningChoice(
            lastChoice
        );

    }


    /* 어려움 */

    if (
        difficulty === "hard"
    ) {

        const counts = {

            rock: 0,

            paper: 0,

            scissors: 0

        };


        playerHistory.forEach(
            function(choice) {

                counts[choice]++;

            }
        );


        let mostUsed = "rock";


        if (
            counts.paper >
            counts[mostUsed]
        ) {

            mostUsed = "paper";

        }


        if (
            counts.scissors >
            counts[mostUsed]
        ) {

            mostUsed = "scissors";

        }


        /*
            80% 가장 많이 사용한 패를 카운터
            20% 랜덤
        */

        if (
            Math.random() < 0.8
        ) {

            return getWinningChoice(
                mostUsed
            );

        }


        return randomChoice(options);

    }


    return randomChoice(options);

}


/* ==========================
   가위바위보 플레이
========================== */

function play(player) {

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        stopBot();

        return;

    }


    playerHistory.push(
        player
    );


    const computer =
        getComputerChoice();


    document.getElementById(
        "playerChoice"
    ).textContent =
        choices[player];


    document.getElementById(
        "computerChoice"
    ).textContent =
        choices[computer];


    let result = "";


    /* ==========================
       무승부
    ========================== */

    if (
        player === computer
    ) {

        /*
            행운 아이템
        */

        if (
            activeItems.lucky
        ) {

            activeItems.lucky =
                false;


            let points = 1;


            /*
                행운 + 점수 2배
            */

            if (
                activeItems.double
            ) {

                points = 2;

                activeItems.double =
                    false;


                result =
                    "🍀 행운 발동! " +
                    "⚡ 점수 2배 발동! " +
                    "+2점!";

            } else {

                result =
                    "🍀 행운 발동! " +
                    "무승부가 승리로 바뀌었습니다! +1점!";

            }


            playerScore += points;

        } else {

            result =
                "🤝 무승부!";

        }

    }


    /* ==========================
       플레이어 승리
    ========================== */

    else if (

        (
            player === "rock" &&
            computer === "scissors"
        )

        ||

        (
            player === "paper" &&
            computer === "rock"
        )

        ||

        (
            player === "scissors" &&
            computer === "paper"
        )

    ) {

        let points = 1;


        /*
            점수 2배
        */

        if (
            activeItems.double
        ) {

            points = 2;

            activeItems.double =
                false;


            result =
                "⚡ 점수 2배 발동! +" +
                points +
                "점!";

        } else {

            result =
                "🎉 " +
                playerName +
                "의 승리! +1점!";

        }


        playerScore += points;

    }


    /* ==========================
       컴퓨터 승리
    ========================== */

    else {

        /*
            방어막
        */

        if (
            activeItems.shield
        ) {

            activeItems.shield =
                false;


            result =
                "🛡️ 방어막 발동! " +
                "패배를 막았습니다!";

        } else {

            computerScore++;


            result =
                "💻 " +
                opponentName +
                "의 승리! +1점!";

        }

    }


    updateScore();

    updateItems();


    /*
        25 / 50 / 75점 보상 확인
    */

    checkItemRewards();


    document.getElementById(
        "result"
    ).textContent =
        result;


    /*
        게임 종료
    */

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        disableGameButtons();

        stopBot();


        const gameOver =
            document.getElementById(
                "gameOver"
            );


        if (
            playerScore >= MAX_SCORE
        ) {

            gameOver.textContent =
                "🏆 " +
                playerName +
                " 승리! " +
                "최종 점수: " +
                playerScore +
                " : " +
                computerScore;

        } else {

            gameOver.textContent =
                "🤖 " +
                opponentName +
                " 승리! " +
                "최종 점수: " +
                playerScore +
                " : " +
                computerScore;

        }


        gameOver.style.display =
            "block";

    }

}


/* ==========================
   점수 업데이트
========================== */

function updateScore() {

    document.getElementById(
        "playerScore"
    ).textContent =
        playerScore;


    document.getElementById(
        "computerScore"
    ).textContent =
        computerScore;

}


/* ==========================
   게임 버튼 비활성화
========================== */

function disableGameButtons() {

    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(
            function(button) {

                button.disabled =
                    true;

            }
        );


    updateItems();

}


/* ==========================
   게임 버튼 활성화
========================== */

function enableGameButtons() {

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        return;

    }


    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(
            function(button) {

                button.disabled =
                    false;

            }
        );

}


/* ==========================
   봇 플레이 시작
========================== */

function startBot() {

    if (botPlaying) {

        return;

    }


    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        return;

    }


    botPlaying = true;


    updateBotStatus();


    botPlay();


    botTimer =
        setInterval(
            botPlay,
            BOT_INTERVAL
        );

}


/* ==========================
   봇 자동 플레이
========================== */

function botPlay() {

    if (!botPlaying) {

        return;

    }


    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        stopBot();

        return;

    }


    const options = [

        "rock",

        "paper",

        "scissors"

    ];


    /*
        봇이 플레이어 쪽 선택을
        자동으로 결정
    */

    const playerChoice =
        randomChoice(options);


    disableGameButtons();


    /*
        카운트다운 없음
    */

    document.getElementById(
        "botThinking"
    ).textContent =
        "🤖 봇이 선택하는 중...";


    botActionTimer =
        setTimeout(
            function() {

                if (!botPlaying) {

                    return;

                }


                play(
                    playerChoice
                );


                document.getElementById(
                    "botThinking"
                ).textContent =
                    "";


                if (

                    botPlaying &&

                    playerScore <
                        MAX_SCORE &&

                    computerScore <
                        MAX_SCORE

                ) {

                    enableGameButtons();

                }

            },
            BOT_THINK_TIME
        );

}


/* ==========================
   봇 플레이 중지
========================== */

function stopBot() {

    botPlaying = false;


    if (
        botTimer !== null
    ) {

        clearInterval(
            botTimer
        );

        botTimer = null;

    }


    if (
        botActionTimer !== null
    ) {

        clearTimeout(
            botActionTimer
        );

        botActionTimer = null;

    }


    document.getElementById(
        "botThinking"
    ).textContent =
        "";


    updateBotStatus();

}


/* ==========================
   봇 상태 표시
========================== */

function updateBotStatus() {

    const status =
        document.getElementById(
            "botStatus"
        );


    const startButton =
        document.getElementById(
            "botStart"
        );


    const stopButton =
        document.getElementById(
            "botStop"
        );


    if (botPlaying) {

        status.textContent =
            "🤖 봇 플레이: 실행 중";


        status.classList.remove(
            "inactive"
        );


        status.classList.add(
            "active"
        );


        startButton.disabled =
            true;


        stopButton.disabled =
            false;

    } else {

        status.textContent =
            "🤖 봇 플레이: 꺼짐";


        status.classList.remove(
            "active"
        );


        status.classList.add(
            "inactive"
        );


        startButton.disabled =
            false;


        stopButton.disabled =
            true;

    }

}


/* ==========================
   게임 초기화
========================== */

function resetGame() {

    stopBot();


    playerScore = 0;

    computerScore = 0;

    playerHistory = [];


    resetItems();


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "computerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    enableGameButtons();

}


/* ==========================
   이름 변경
========================== */

function changeName() {

    stopBot();


    document.getElementById(
        "gameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "nameScreen"
    ).style.display =
        "block";


    document.getElementById(
        "playerNameInput"
    ).value =
        playerName;


    document.getElementById(
        "opponentNameInput"
    ).value =
        opponentName;


    document.getElementById(
        difficulty
    ).checked =
        true;


    document.getElementById(
        "playerNameInput"
    ).focus();

}


/* ==========================
   Enter 키
========================== */

document.getElementById(
    "playerNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startGame();

        }

    }
);


document.getElementById(
    "opponentNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startGame();

        }

    }
);


/* ==========================
   새로고침 초기화
========================== */

window.addEventListener(
    "load",
    function() {

        playerScore = 0;

        computerScore = 0;

        playerName = "";

        opponentName = "";

        difficulty = "easy";

        playerHistory = [];


        resetItems();

        stopBot();


        document.getElementById(
            "nameScreen"
        ).style.display =
            "block";


        document.getElementById(
            "gameScreen"
        ).style.display =
            "none";


        document.getElementById(
            "playerNameInput"
        ).value =
            "";


        document.getElementById(
            "opponentNameInput"
        ).value =
            "";


        document.getElementById(
            "easy"
        ).checked =
            true;


        updateScore();

    }
);

</script>

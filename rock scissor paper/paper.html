```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 게임</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        /* 이름 설정 */

        #nameScreen h2 {
            margin-bottom: 25px;
        }

        .name-input {
            width: 80%;
            padding: 15px;
            margin: 8px 0;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            text-align: center;
        }

        .name-input:focus {
            border-color: #667eea;
        }

        #startButton {
            margin-top: 15px;
            width: 80%;
            background: #667eea;
        }

        /* 게임 화면 */

        #gameScreen {
            display: none;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
            font-size: 20px;
        }

        .score-box {
            background: #f1f3f5;
            padding: 15px 25px;
            border-radius: 15px;
            min-width: 120px;
        }

        .battle {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 35px 0;
        }

        .player,
        .computer {
            font-size: 18px;
        }

        .choice {
            font-size: 70px;
            margin-top: 10px;
        }

        .vs {
            font-size: 25px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-4px);
            background: #5568d8;
        }

        button:active {
            transform: scale(0.95);
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            min-height: 40px;
        }

        #reset {
            margin-top: 15px;
            background: #343a40;
        }

        #changeName {
            margin-top: 10px;
            background: #868e96;
        }
    </style>
</head>

<body>

<div class="game">

    <!-- ==========================
         이름 설정 화면
         ========================== -->

    <div id="nameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <h2>게임 이름 설정</h2>

        <input
            type="text"
            id="playerNameInput"
            class="name-input"
            placeholder="내 이름"
            maxlength="20"
        >

        <br>

        <input
            type="text"
            id="opponentNameInput"
            class="name-input"
            placeholder="상대방 이름"
            maxlength="20"
        >

        <br>

        <button id="startButton" onclick="startGame()">
            🎮 게임 시작
        </button>

    </div>


    <!-- ==========================
         게임 화면
         ========================== -->

    <div id="gameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <div class="score">

            <div class="score-box">
                <span id="playerName">
                    플레이어
                </span>

                <br>

                <strong id="playerScore">
                    0
                </strong>
            </div>


            <div class="score-box">
                <span id="opponentName">
                    컴퓨터
                </span>

                <br>

                <strong id="computerScore">
                    0
                </strong>
            </div>

        </div>


        <!-- 대결 화면 -->

        <div class="battle">

            <div class="player">

                <div id="playerNameBattle">
                    플레이어
                </div>

                <div class="choice" id="playerChoice">
                    ❔
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="computer">

                <div id="opponentNameBattle">
                    컴퓨터
                </div>

                <div class="choice" id="computerChoice">
                    ❔
                </div>

            </div>

        </div>


        <div id="result">
            아래에서 선택하세요!
        </div>


        <!-- 선택 버튼 -->

        <div class="buttons">

            <button onclick="play('rock')">
                ✊ 바위
            </button>

            <button onclick="play('paper')">
                ✋ 보
            </button>

            <button onclick="play('scissors')">
                ✌️ 가위
            </button>

        </div>


        <button id="reset" onclick="resetGame()">
            🔄 게임 초기화
        </button>

        <br>

        <button id="changeName" onclick="changeName()">
            ✏️ 이름 변경
        </button>

    </div>

</div>


<script>

    // ==========================
    // 변수
    // ==========================

    let playerScore = 0;
    let computerScore = 0;

    let playerName = "";
    let opponentName = "";


    // 가위바위보 이모지

    const choices = {
        rock: "✊",
        paper: "✋",
        scissors: "✌️"
    };


    // ==========================
    // 게임 시작
    // ==========================

    function startGame() {

        const playerInput =
            document.getElementById("playerNameInput");

        const opponentInput =
            document.getElementById("opponentNameInput");


        const player =
            playerInput.value.trim();

        const opponent =
            opponentInput.value.trim();


        // 내 이름 확인

        if (player === "") {

            alert("내 이름을 입력해주세요!");

            playerInput.focus();

            return;
        }


        // 상대방 이름 확인

        if (opponent === "") {

            alert("상대방 이름을 입력해주세요!");

            opponentInput.focus();

            return;
        }


        // 이름 저장

        playerName = player;
        opponentName = opponent;


        // 이름 표시

        document.getElementById("playerName").textContent =
            playerName;

        document.getElementById("playerNameBattle").textContent =
            playerName;


        document.getElementById("opponentName").textContent =
            opponentName;

        document.getElementById("opponentNameBattle").textContent =
            opponentName;


        // 화면 전환

        document.getElementById("nameScreen").style.display =
            "none";

        document.getElementById("gameScreen").style.display =
            "block";
    }


    // ==========================
    // 가위바위보 게임
    // ==========================

    function play(player) {

        const options = [
            "rock",
            "paper",
            "scissors"
        ];


        // 상대방의 랜덤 선택

        const computer =
            options[
                Math.floor(Math.random() * options.length)
            ];


        // 선택 표시

        document.getElementById("playerChoice").textContent =
            choices[player];

        document.getElementById("computerChoice").textContent =
            choices[computer];


        let result = "";


        // ==========================
        // 승부 판정
        // ==========================

        if (player === computer) {

            result =
                "🤝 무승부!";

        }


        else if (

            (player === "rock" &&
             computer === "scissors") ||

            (player === "paper" &&
             computer === "rock") ||

            (player === "scissors" &&
             computer === "paper")

        ) {

            playerScore++;

            result =
                "🎉 " + playerName + "의 승리!";

        }


        else {

            computerScore++;

            result =
                "🎉 " + opponentName + "의 승리!";

        }


        // 결과 표시

        document.getElementById("result").textContent =
            result;


        // 점수 표시

        document.getElementById("playerScore").textContent =
            playerScore;

        document.getElementById("computerScore").textContent =
            computerScore;
    }


    // ==========================
    // 게임 초기화
    // ==========================

    function resetGame() {

        playerScore = 0;
        computerScore = 0;


        document.getElementById("playerScore").textContent =
            "0";

        document.getElementById("computerScore").textContent =
            "0";


        document.getElementById("playerChoice").textContent =
            "❔";

        document.getElementById("computerChoice").textContent =
            "❔";


        document.getElementById("result").textContent =
            "아래에서 선택하세요!";
    }


    // ==========================
    // 이름 변경
    // ==========================

    function changeName() {

        document.getElementById("gameScreen").style.display =
            "none";

        document.getElementById("nameScreen").style.display =
            "block";


        // 기존 이름을 입력칸에 표시

        document.getElementById("playerNameInput").value =
            playerName;

        document.getElementById("opponentNameInput").value =
            opponentName;


        document.getElementById("playerNameInput").focus();
    }


    // ==========================
    // Enter 키
    // ==========================

    document.getElementById("playerNameInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    startGame();
                }

            }
        );


    document.getElementById("opponentNameInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    startGame();
                }

            }
        );


    // ==========================
    // 새로고침 시 초기 상태
    // ==========================

    window.addEventListener(
        "load",
        function() {

            document.getElementById("nameScreen").style.display =
                "block";

            document.getElementById("gameScreen").style.display =
                "none";


            document.getElementById("playerNameInput").value =
                "";

            document.getElementById("opponentNameInput").value =
                "";


            playerName = "";
            opponentName = "";

            playerScore = 0;
            computerScore = 0;
        }
    );

</script>

</body>
</html>
```

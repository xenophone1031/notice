```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 게임</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        /* 이름 설정 화면 */
        #nameScreen h2 {
            margin-bottom: 25px;
        }

        #nameInput {
            width: 80%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            text-align: center;
        }

        #nameInput:focus {
            border-color: #667eea;
        }

        #startButton {
            margin-top: 15px;
            width: 80%;
            background: #667eea;
        }

        /* 게임 화면 */
        #gameScreen {
            display: none;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
            font-size: 20px;
        }

        .score-box {
            background: #f1f3f5;
            padding: 15px 25px;
            border-radius: 15px;
            min-width: 120px;
        }

        .battle {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 35px 0;
        }

        .player,
        .computer {
            font-size: 18px;
        }

        .choice {
            font-size: 70px;
            margin-top: 10px;
        }

        .vs {
            font-size: 25px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-4px);
            background: #5568d8;
        }

        button:active {
            transform: scale(0.95);
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            min-height: 40px;
        }

        #reset {
            margin-top: 15px;
            background: #343a40;
        }

        #reset:hover {
            background: #212529;
        }

        #changeName {
            margin-top: 10px;
            background: #868e96;
        }
    </style>
</head>

<body>

<div class="game">

    <!-- 이름 설정 화면 -->
    <div id="nameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <h2>플레이어 이름을 입력하세요</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="이름을 입력하세요"
            maxlength="20"
        >

        <br>

        <button id="startButton" onclick="startGame()">
            🎮 게임 시작
        </button>

    </div>


    <!-- 게임 화면 -->
    <div id="gameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <div class="score">

            <div class="score-box">
                <span id="playerName">플레이어</span><br>
                <strong id="playerScore">0</strong>
            </div>

            <div class="score-box">
                컴퓨터<br>
                <strong id="computerScore">0</strong>
            </div>

        </div>


        <div class="battle">

            <div class="player">

                <div id="playerNameBattle">
                    플레이어
                </div>

                <div class="choice" id="playerChoice">
                    ❔
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="computer">

                <div>
                    컴퓨터
                </div>

                <div class="choice" id="computerChoice">
                    ❔
                </div>

            </div>

        </div>


        <div id="result">
            아래에서 선택하세요!
        </div>


        <div class="buttons">

            <button onclick="play('rock')">
                ✊ 바위
            </button>

            <button onclick="play('paper')">
                ✋ 보
            </button>

            <button onclick="play('scissors')">
                ✌️ 가위
            </button>

        </div>


        <button id="reset" onclick="resetGame()">
            🔄 게임 초기화
        </button>

        <br>

        <button id="changeName" onclick="changeName()">
            ✏️ 이름 변경
        </button>

    </div>

</div>


<script>

    let playerScore = 0;
    let computerScore = 0;

    let playerName = "";

    const choices = {
        rock: "✊",
        paper: "✋",
        scissors: "✌️"
    };


    // 게임 시작
    function startGame() {

        const input = document.getElementById("nameInput");

        const name = input.value.trim();

        if (name === "") {
            alert("이름을 입력해주세요!");
            input.focus();
            return;
        }

        playerName = name;

        document.getElementById("playerName").textContent =
            playerName;

        document.getElementById("playerNameBattle").textContent =
            playerName;

        document.getElementById("nameScreen").style.display =
            "none";

        document.getElementById("gameScreen").style.display =
            "block";
    }


    // 가위바위보 실행
    function play(player) {

        const options = [
            "rock",
            "paper",
            "scissors"
        ];

        const computer =
            options[Math.floor(Math.random() * options.length)];


        // 선택 표시
        document.getElementById("playerChoice").textContent =
            choices[player];

        document.getElementById("computerChoice").textContent =
            choices[computer];


        let result = "";


        // 승부 판정
        if (player === computer) {

            result = "🤝 무승부!";

        }

        else if (
            (player === "rock" && computer === "scissors") ||
            (player === "paper" && computer === "rock") ||
            (player === "scissors" && computer === "paper")
        ) {

            result = "🎉 " + playerName + "의 승리!";

            playerScore++;

        }

        else {

            result = "💻 컴퓨터의 승리!";

            computerScore++;

        }


        // 결과 표시
        document.getElementById("result").textContent =
            result;


        // 점수 업데이트
        document.getElementById("playerScore").textContent =
            playerScore;

        document.getElementById("computerScore").textContent =
            computerScore;
    }


    // 게임 초기화
    function resetGame() {

        playerScore = 0;
        computerScore = 0;

        document.getElementById("playerScore").textContent = 0;
        document.getElementById("computerScore").textContent = 0;

        document.getElementById("playerChoice").textContent = "❔";
        document.getElementById("computerChoice").textContent = "❔";

        document.getElementById("result").textContent =
            "아래에서 선택하세요!";
    }


    // 이름 변경
    function changeName() {

        document.getElementById("gameScreen").style.display =
            "none";

        document.getElementById("nameScreen").style.display =
            "block";

        document.getElementById("nameInput").value =
            playerName;

        document.getElementById("nameInput").focus();
    }


    // Enter 키로 게임 시작
    document.getElementById("nameInput").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                startGame();
            }

        }
    );

</script>

</body>
</html>

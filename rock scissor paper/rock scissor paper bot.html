<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>가위바위보 게임</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                "Malgun Gothic",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }


        .game-container {

            width: 90%;

            max-width: 700px;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);

            text-align: center;
        }


        h1 {

            margin-top: 0;

            margin-bottom: 25px;

            color: #333;
        }


        /* ==========================
           이름 설정 화면
        ========================== */

        #nameScreen {

            display: block;
        }


        .input-group {

            margin-bottom: 15px;
        }


        .input-group input {

            width: 100%;

            padding: 14px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }


        .input-group input:focus {

            border-color: #667eea;
        }


        /* ==========================
           난이도
        ========================== */

        .difficulty-title {

            margin-top: 25px;

            margin-bottom: 12px;

            font-size: 18px;

            font-weight: bold;

            color: #333;
        }


        .difficulty-group {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        .difficulty-option {

            flex: 1;
        }


        .difficulty-option input {

            display: none;
        }


        .difficulty-option label {

            display: block;

            padding: 14px 8px;

            border: 2px solid #ddd;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.2s;

            font-weight: bold;

            color: #555;
        }


        .difficulty-option label:hover {

            border-color: #667eea;
        }


        .difficulty-option input:checked + label {

            background: #667eea;

            border-color: #667eea;

            color: white;
        }


        /* ==========================
           게임 시작 버튼
        ========================== */

        #startButton {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #startButton:hover {

            background: #5568d8;

            transform: translateY(-2px);
        }


        /* ==========================
           게임 화면
        ========================== */

        #gameScreen {

            display: none;
        }


        .difficulty-display {

            display: inline-block;

            margin-bottom: 15px;

            padding: 8px 15px;

            background: #f1f3f5;

            border-radius: 20px;

            font-weight: bold;

            color: #555;
        }


        /* ==========================
           봇 상태
        ========================== */

        .bot-status {

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 10px;

            background: #f8f9fa;

            font-size: 15px;

            font-weight: bold;
        }


        .bot-status.active {

            background: #e8f5e9;

            color: #2e7d32;
        }


        .bot-status.inactive {

            background: #f5f5f5;

            color: #777;
        }


        /* ==========================
           점수판
        ========================== */

        .score-board {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 25px;
        }


        .score-box {

            flex: 1;

            padding: 20px;

            background: #f8f9fa;

            border-radius: 15px;
        }


        .score-name {

            font-size: 18px;

            font-weight: bold;

            color: #555;

            margin-bottom: 10px;
        }


        .score {

            font-size: 42px;

            font-weight: bold;

            color: #667eea;
        }


        /* ==========================
           대결 영역
        ========================== */

        .battle {

            display: flex;

            justify-content: space-around;

            align-items: center;

            margin: 30px 0;
        }


        .player-area {

            flex: 1;
        }


        .battle-name {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 15px;

            color: #333;
        }


        .choice {

            font-size: 70px;

            min-height: 85px;
        }


        .vs {

            font-size: 24px;

            font-weight: bold;

            color: #999;

            padding: 0 15px;
        }


        /* ==========================
           결과
        ========================== */

        #result {

            min-height: 30px;

            margin: 20px 0;

            font-size: 20px;

            font-weight: bold;

            color: #333;
        }


        /* ==========================
           게임 버튼
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-bottom: 20px;
        }


        .buttons button {

            width: 100px;

            height: 70px;

            border: none;

            border-radius: 15px;

            background: #667eea;

            color: white;

            font-size: 35px;

            cursor: pointer;

            transition: 0.2s;
        }


        .buttons button:hover:not(:disabled) {

            transform: translateY(-5px);

            background: #5568d8;
        }


        .buttons button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* ==========================
           봇 버튼
        ========================== */

        .bot-buttons {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }


        .bot-buttons button {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        #botStart {

            background: #4caf50;

            color: white;
        }


        #botStop {

            background: #f44336;

            color: white;
        }


        .bot-buttons button:disabled {

            opacity: 0.4;

            cursor: not-allowed;
        }


        /* ==========================
           하단 버튼
        ========================== */

        .control-buttons {

            display: flex;

            gap: 10px;
        }


        .control-buttons button {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            background: #eee;

            color: #333;
        }


        .max-score {

            margin-top: 15px;

            color: #888;

            font-size: 14px;
        }


        @media (max-width: 500px) {

            .game-container {

                padding: 20px;
            }


            .difficulty-group {

                flex-direction: column;
            }


            .buttons button {

                width: 80px;

                height: 60px;

                font-size: 30px;
            }


            .choice {

                font-size: 55px;
            }

        }

    </style>

</head>


<body>


<div class="game-container">


    <h1>✊ 가위바위보 ✌️</h1>


    <!-- ==========================
         이름 및 난이도 설정
    ========================== -->

    <div id="nameScreen">


        <div class="input-group">

            <input
                type="text"
                id="playerNameInput"
                placeholder="내 이름"
                maxlength="20"
            >

        </div>


        <div class="input-group">

            <input
                type="text"
                id="opponentNameInput"
                placeholder="상대방 이름"
                maxlength="20"
            >

        </div>


        <div class="difficulty-title">

            🎮 난이도 선택

        </div>


        <div class="difficulty-group">


            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="easy"
                    value="easy"
                    checked
                >

                <label for="easy">
                    🟢 쉬움
                </label>

            </div>


            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="normal"
                    value="normal"
                >

                <label for="normal">
                    🟡 보통
                </label>

            </div>


            <div class="difficulty-option">

                <input
                    type="radio"
                    name="difficulty"
                    id="hard"
                    value="hard"
                >

                <label for="hard">
                    🔴 어려움
                </label>

            </div>

        </div>


        <button
            id="startButton"
            onclick="startGame()"
        >
            게임 시작
        </button>


    </div>


    <!-- ==========================
         게임 화면
    ========================== -->

    <div id="gameScreen">


        <div
            id="difficultyDisplay"
            class="difficulty-display"
        >
            🟢 쉬움
        </div>


        <div
            id="botStatus"
            class="bot-status inactive"
        >
            🤖 봇 플레이: 꺼짐
        </div>


        <!-- 점수 -->

        <div class="score-board">


            <div class="score-box">

                <div
                    class="score-name"
                    id="playerName"
                >
                    나
                </div>

                <div
                    class="score"
                    id="playerScore"
                >
                    0
                </div>

            </div>


            <div class="score-box">

                <div
                    class="score-name"
                    id="opponentName"
                >
                    컴퓨터
                </div>

                <div
                    class="score"
                    id="computerScore"
                >
                    0
                </div>

            </div>


        </div>


        <!-- 대결 -->

        <div class="battle">


            <div class="player-area">

                <div
                    class="battle-name"
                    id="playerNameBattle"
                >
                    나
                </div>

                <div
                    class="choice"
                    id="playerChoice"
                >
                    ❔
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="player-area">

                <div
                    class="battle-name"
                    id="opponentNameBattle"
                >
                    컴퓨터
                </div>

                <div
                    class="choice"
                    id="computerChoice"
                >
                    ❔
                </div>

            </div>


        </div>


        <!-- 결과 -->

        <div id="result">
            아래에서 선택하세요!
        </div>


        <!-- 플레이어 선택 -->

        <div class="buttons">


            <button
                onclick="play('rock')"
                title="바위"
            >
                ✊
            </button>


            <button
                onclick="play('paper')"
                title="보"
            >
                ✋
            </button>


            <button
                onclick="play('scissors')"
                title="가위"
            >
                ✌️
            </button>


        </div>


        <!-- 봇 플레이 -->

        <div class="bot-buttons">


            <button
                id="botStart"
                onclick="startBot()"
            >
                🤖 봇 플레이 시작
            </button>


            <button
                id="botStop"
                onclick="stopBot()"
                disabled
            >
                ⏹️ 봇 플레이 중지
            </button>


        </div>


        <!-- 컨트롤 -->

        <div class="control-buttons">


            <button
                onclick="resetGame()"
            >
                🔄 게임 초기화
            </button>


            <button
                onclick="changeName()"
            >
                ⚙️ 설정 변경
            </button>


        </div>


        <div class="max-score">

            🏆 먼저 100점을 달성하면 승리합니다.

        </div>


    </div>


</div>


<script>


    // ==========================
    // 변수
    // ==========================

    let playerScore = 0;

    let computerScore = 0;

    let playerName = "";

    let opponentName = "";

    let difficulty = "easy";

    let playerHistory = [];

    let botTimer = null;

    let botPlaying = false;


    // 최대 점수

    const MAX_SCORE = 100;


    // 봇 플레이 간격
    // 1500 = 1.5초

    const BOT_INTERVAL = 1500;


    // 가위바위보

    const choices = {

        rock: "✊",

        paper: "✋",

        scissors: "✌️"

    };


    // 난이도 이름

    const difficultyNames = {

        easy: "🟢 쉬움",

        normal: "🟡 보통",

        hard: "🔴 어려움"

    };


    // ==========================
    // 게임 시작
    // ==========================

    function startGame() {


        const playerInput =
            document.getElementById(
                "playerNameInput"
            );


        const opponentInput =
            document.getElementById(
                "opponentNameInput"
            );


        const player =
            playerInput.value.trim();


        const opponent =
            opponentInput.value.trim();


        if (player === "") {

            alert(
                "내 이름을 입력해주세요!"
            );

            playerInput.focus();

            return;
        }


        if (opponent === "") {

            alert(
                "상대방 이름을 입력해주세요!"
            );

            opponentInput.focus();

            return;
        }


        // 이름

        playerName = player;

        opponentName = opponent;


        // 난이도

        const selectedDifficulty =
            document.querySelector(
                'input[name="difficulty"]:checked'
            );


        difficulty =
            selectedDifficulty
                ? selectedDifficulty.value
                : "easy";


        // 초기화

        playerScore = 0;

        computerScore = 0;

        playerHistory = [];


        // 봇 중지

        stopBot();


        // 이름 표시

        document.getElementById(
            "playerName"
        ).textContent =
            playerName;


        document.getElementById(
            "playerNameBattle"
        ).textContent =
            playerName;


        document.getElementById(
            "opponentName"
        ).textContent =
            opponentName;


        document.getElementById(
            "opponentNameBattle"
        ).textContent =
            opponentName;


        // 난이도 표시

        document.getElementById(
            "difficultyDisplay"
        ).textContent =
            difficultyNames[difficulty];


        // 점수 초기화

        updateScore();


        // 선택 초기화

        document.getElementById(
            "playerChoice"
        ).textContent =
            "❔";


        document.getElementById(
            "computerChoice"
        ).textContent =
            "❔";


        document.getElementById(
            "result"
        ).textContent =
            "아래에서 선택하세요!";


        // 버튼 활성화

        enableGameButtons();


        // 화면 전환

        document.getElementById(
            "nameScreen"
        ).style.display =
            "none";


        document.getElementById(
            "gameScreen"
        ).style.display =
            "block";

    }


    // ==========================
    // 랜덤 선택
    // ==========================

    function randomChoice(options) {


        return options[
            Math.floor(
                Math.random() *
                options.length
            )
        ];

    }


    // ==========================
    // 특정 선택을 이기는 선택
    // ==========================

    function getWinningChoice(choice) {


        if (choice === "rock") {

            return "paper";
        }


        if (choice === "paper") {

            return "scissors";
        }


        return "rock";

    }


    // ==========================
    // 컴퓨터 선택
    // ==========================

    function getComputerChoice() {


        const options = [

            "rock",

            "paper",

            "scissors"

        ];


        // ==========================
        // 쉬움
        // ==========================

        if (
            difficulty === "easy"
        ) {

            return randomChoice(
                options
            );
        }


        // 기록이 없으면 랜덤

        if (
            playerHistory.length === 0
        ) {

            return randomChoice(
                options
            );
        }


        // ==========================
        // 보통
        // ==========================

        if (
            difficulty === "normal"
        ) {


            const lastChoice =
                playerHistory[
                    playerHistory.length - 1
                ];


            // 60% 랜덤

            if (
                Math.random() < 0.6
            ) {

                return randomChoice(
                    options
                );
            }


            // 40% 카운터

            return getWinningChoice(
                lastChoice
            );
        }


        // ==========================
        // 어려움
        // ==========================

        if (
            difficulty === "hard"
        ) {


            const counts = {

                rock: 0,

                paper: 0,

                scissors: 0

            };


            playerHistory.forEach(
                function(choice) {

                    counts[choice]++;

                }
            );


            let mostUsed = "rock";


            if (
                counts.paper >
                counts[mostUsed]
            ) {

                mostUsed = "paper";
            }


            if (
                counts.scissors >
                counts[mostUsed]
            ) {

                mostUsed = "scissors";
            }


            // 80% 카운터

            if (
                Math.random() < 0.8
            ) {

                return getWinningChoice(
                    mostUsed
                );
            }


            // 20% 랜덤

            return randomChoice(
                options
            );
        }


        return randomChoice(
            options
        );

    }


    // ==========================
    // 가위바위보 실행
    // ==========================

    function play(player) {


        // 100점이면 종료

        if (

            playerScore >= MAX_SCORE ||

            computerScore >= MAX_SCORE

        ) {

            stopBot();

            return;
        }


        // 플레이어 기록

        playerHistory.push(
            player
        );


        // 컴퓨터 선택

        const computer =
            getComputerChoice();


        // 선택 표시

        document.getElementById(
            "playerChoice"
        ).textContent =
            choices[player];


        document.getElementById(
            "computerChoice"
        ).textContent =
            choices[computer];


        let result = "";


        // ==========================
        // 무승부
        // ==========================

        if (
            player === computer
        ) {

            result =
                "🤝 무승부!";
        }


        // ==========================
        // 플레이어 승리
        // ==========================

        else if (

            (
                player === "rock" &&
                computer === "scissors"
            )

            ||

            (
                player === "paper" &&
                computer === "rock"
            )

            ||

            (
                player === "scissors" &&
                computer === "paper"
            )

        ) {


            playerScore =
                Math.min(
                    playerScore + 1,
                    MAX_SCORE
                );


            if (
                playerScore === MAX_SCORE
            ) {

                result =
                    "🏆 " +
                    playerName +
                    "이(가) 100점 달성! 승리!";

            }

            else {

                result =
                    "🎉 " +
                    playerName +
                    "의 승리! +1점";
            }

        }


        // ==========================
        // 컴퓨터 승리
        // ==========================

        else {


            computerScore =
                Math.min(
                    computerScore + 1,
                    MAX_SCORE
                );


            if (
                computerScore === MAX_SCORE
            ) {

                result =
                    "🏆 " +
                    opponentName +
                    "이(가) 100점 달성! 승리!";

            }

            else {

                result =
                    "🎉 " +
                    opponentName +
                    "의 승리! +1점";
            }

        }


        // 점수 업데이트

        updateScore();


        // 결과 표시

        document.getElementById(
            "result"
        ).textContent =
            result;


        // 50점 도달

        if (

            playerScore === MAX_SCORE ||

            computerScore === MAX_SCORE

        ) {

            disableGameButtons();

            stopBot();

        }

    }


    // ==========================
    // 점수 업데이트
    // ==========================

    function updateScore() {


        document.getElementById(
            "playerScore"
        ).textContent =
            playerScore;


        document.getElementById(
            "computerScore"
        ).textContent =
            computerScore;

    }


    // ==========================
    // 게임 버튼 비활성화
    // ==========================

    function disableGameButtons() {


        document
            .querySelectorAll(
                ".buttons button"
            )
            .forEach(
                function(button) {

                    button.disabled = true;

                }
            );

    }


    // ==========================
    // 게임 버튼 활성화
    // ==========================

    function enableGameButtons() {


        document
            .querySelectorAll(
                ".buttons button"
            )
            .forEach(
                function(button) {

                    button.disabled = false;

                }
            );

    }


    // ==========================
    // 봇 플레이 시작
    // ==========================

    function startBot() {


        // 이미 실행 중이면 무시

        if (botPlaying) {

            return;
        }


        // 게임 종료 확인

        if (

            playerScore >= MAX_SCORE ||

            computerScore >= MAX_SCORE

        ) {

            return;
        }


        botPlaying = true;


        updateBotStatus();


        // 즉시 한 번 플레이

        botPlay();


        // 이후 일정 시간마다 플레이

        botTimer =
            setInterval(
                botPlay,
                BOT_INTERVAL
            );

    }


    // ==========================
    // 봇 자동 플레이
    // ==========================

    function botPlay() {


        if (!botPlaying) {

            return;
        }


        // 게임 종료

        if (

            playerScore >= MAX_SCORE ||

            computerScore >= MAX_SCORE

        ) {

            stopBot();

            return;
        }


        const options = [

            "rock",

            "paper",

            "scissors"

        ];


        // 봇은 플레이어 대신
        // 랜덤으로 선택

        const playerChoice =
            randomChoice(options);


        // 실제 게임 실행

        play(playerChoice);

    }


    // ==========================
    // 봇 플레이 중지
    // ==========================

    function stopBot() {


        botPlaying = false;


        if (botTimer !== null) {

            clearInterval(
                botTimer
            );

            botTimer = null;

        }


        updateBotStatus();

    }


    // ==========================
    // 봇 상태 표시
    // ==========================

    function updateBotStatus() {


        const status =
            document.getElementById(
                "botStatus"
            );


        const startButton =
            document.getElementById(
                "botStart"
            );


        const stopButton =
            document.getElementById(
                "botStop"
            );


        if (botPlaying) {


            status.textContent =
                "🤖 봇 플레이: 켜짐";


            status.classList.remove(
                "inactive"
            );


            status.classList.add(
                "active"
            );


            startButton.disabled =
                true;


            stopButton.disabled =
                false;

        }

        else {


            status.textContent =
                "🤖 봇 플레이: 꺼짐";


            status.classList.remove(
                "active"
            );


            status.classList.add(
                "inactive"
            );


            startButton.disabled =
                false;


            stopButton.disabled =
                true;

        }

    }


    // ==========================
    // 게임 초기화
    // ==========================

    function resetGame() {


        // 봇 중지

        stopBot();


        // 점수 초기화

        playerScore = 0;

        computerScore = 0;


        // 기록 초기화

        playerHistory = [];


        // 점수 표시

        updateScore();


        // 선택 초기화

        document.getElementById(
            "playerChoice"
        ).textContent =
            "❔";


        document.getElementById(
            "computerChoice"
        ).textContent =
            "❔";


        // 결과 초기화

        document.getElementById(
            "result"
        ).textContent =
            "아래에서 선택하세요!";


        // 게임 버튼 활성화

        enableGameButtons();

    }


    // ==========================
    // 설정 변경
    // ==========================

    function changeName() {


        // 봇 중지

        stopBot();


        // 게임 화면 숨김

        document.getElementById(
            "gameScreen"
        ).style.display =
            "none";


        // 설정 화면 표시

        document.getElementById(
            "nameScreen"
        ).style.display =
            "block";


        // 기존 이름 표시

        document.getElementById(
            "playerNameInput"
        ).value =
            playerName;


        document.getElementById(
            "opponentNameInput"
        ).value =
            opponentName;


        // 기존 난이도 표시

        document.getElementById(
            difficulty
        ).checked =
            true;


        document.getElementById(
            "playerNameInput"
        ).focus();

    }


    // ==========================
    // Enter 키
    // ==========================

    document.getElementById(
        "playerNameInput"
    ).addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                startGame();

            }

        }
    );


    document.getElementById(
        "opponentNameInput"
    ).addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                startGame();

            }

        }
    );


    // ==========================
    // 새로고침 시 초기화
    // ==========================

    window.addEventListener(
        "load",
        function() {


            // 봇 중지

            stopBot();


            // 이름 초기화

            playerName = "";

            opponentName = "";


            document.getElementById(
                "playerNameInput"
            ).value =
                "";


            document.getElementById(
                "opponentNameInput"
            ).value =
                "";


            // 점수 초기화

            playerScore = 0;

            computerScore = 0;


            // 난이도 초기화

            difficulty = "easy";


            document.getElementById(
                "easy"
            ).checked =
                true;


            // 기록 초기화

            playerHistory = [];


            // 화면 초기화

            document.getElementById(
                "nameScreen"
            ).style.display =
                "block";


            document.getElementById(
                "gameScreen"
            ).style.display =
                "none";


            // 점수

            updateScore();


            // 선택

            document.getElementById(
                "playerChoice"
            ).textContent =
                "❔";


            document.getElementById(
                "computerChoice"
            ).textContent =
                "❔";


            // 결과

            document.getElementById(
                "result"
            ).textContent =
                "아래에서 선택하세요!";


            // 버튼

            enableGameButtons();


            // 입력 포커스

            document.getElementById(
                "playerNameInput"
            ).focus();

        }
    );

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보 게임</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.game-container {
    width: 90%;
    max-width: 700px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
}

h1 {
    margin-top: 0;
    margin-bottom: 25px;
    color: #333;
}

/* 이름 설정 */

#nameScreen {
    display: block;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.input-group input:focus {
    border-color: #667eea;
}

/* 난이도 */

.difficulty-title {
    margin-top: 25px;
    margin-bottom: 12px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

.difficulty-group {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.difficulty-option {
    flex: 1;
}

.difficulty-option input {
    display: none;
}

.difficulty-option label {
    display: block;
    padding: 14px 8px;
    border: 2px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
    color: #555;
}

.difficulty-option label:hover {
    border-color: #667eea;
}

.difficulty-option input:checked + label {
    background: #667eea;
    border-color: #667eea;
    color: white;
}

/* 시작 버튼 */

#startButton {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#startButton:hover {
    background: #5568d8;
    transform: translateY(-2px);
}

/* 게임 */

#gameScreen {
    display: none;
}

.difficulty-display {
    display: inline-block;
    margin-bottom: 15px;
    padding: 8px 15px;
    background: #f1f3f5;
    border-radius: 20px;
    font-weight: bold;
    color: #555;
}

/* 봇 상태 */

.bot-status {
    margin-bottom: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #f8f9fa;
    font-size: 15px;
    font-weight: bold;
}

.bot-status.active {
    background: #e8f5e9;
    color: #2e7d32;
}

.bot-status.inactive {
    background: #f5f5f5;
    color: #777;
}

/* 점수판 */

.score-board {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
}

.score-box {
    flex: 1;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
}

.score-name {
    font-size: 18px;
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
}

.score {
    font-size: 42px;
    font-weight: bold;
    color: #667eea;
}

/* 대결 */

.battle {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 30px 0;
}

.player-area {
    flex: 1;
}

.battle-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #333;
}

.choice {
    font-size: 70px;
    min-height: 85px;
}

.vs {
    font-size: 24px;
    font-weight: bold;
    color: #999;
    padding: 0 15px;
}

/* 봇 생각 */

#botThinking {
    min-height: 24px;
    color: #667eea;
    font-weight: bold;
}

/* 결과 */

#result {
    min-height: 30px;
    margin: 20px 0;
    font-size: 20px;
    font-weight: bold;
    color: #333;
}

/* 가위바위보 버튼 */

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
}

.buttons button {
    width: 100px;
    height: 70px;
    border: none;
    border-radius: 15px;
    background: #667eea;
    color: white;
    font-size: 35px;
    cursor: pointer;
    transition: 0.2s;
}

.buttons button:hover:not(:disabled) {
    transform: translateY(-5px);
    background: #5568d8;
}

.buttons button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* 아이템 */

.item-section {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #f8f9fa;
    border: 2px solid #eee;
}

.item-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #333;
}

.item-rule {
    margin-bottom: 15px;
    color: #777;
    font-size: 13px;
    line-height: 1.6;
}

.item-rule strong {
    color: #555;
}

.item-list {
    display: flex;
    gap: 10px;
}

.item-card {
    flex: 1;
    padding: 12px 5px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.item-card:hover:not(:disabled) {
    transform: translateY(-3px);
    border-color: #667eea;
}

.item-card:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.item-card.active {
    border-color: #ff8c00;
    background: #fff4e6;
    box-shadow: 0 0 10px rgba(255,140,0,0.25);
}

.item-icon {
    font-size: 30px;
}

.item-name {
    margin-top: 5px;
    font-weight: bold;
    color: #333;
}

.item-count {
    margin-top: 5px;
    font-size: 14px;
    font-weight: bold;
    color: #667eea;
}

.active-items {
    min-height: 24px;
    margin-top: 12px;
    font-size: 14px;
    font-weight: bold;
    color: #ff7a00;
}

/* 아이템 획득 알림 */

#itemNotification {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) scale(0.7);
    width: 320px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 9999;
}

#itemNotification.show {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
}

.notification-icon {
    font-size: 55px;
}

.notification-title {
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
}

.notification-text {
    margin-top: 8px;
    color: #666;
    line-height: 1.5;
}

/* 봇 버튼 */

.bot-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.bot-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#botStart {
    background: #4caf50;
    color: white;
}

#botStop {
    background: #f44336;
    color: white;
}

.bot-buttons button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* 하단 버튼 */

.control-buttons {
    display: flex;
    gap: 10px;
}

.control-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    background: #eee;
    color: #333;
}

.max-score {
    margin-top: 15px;
    color: #888;
    font-size: 14px;
}

/* 게임 종료 */

#gameOver {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: #fff3cd;
    border-radius: 15px;
    color: #856404;
    font-size: 20px;
    font-weight: bold;
}

/* 모바일 */

@media(max-width:500px) {

    .game-container {
        padding: 20px;
    }

    .difficulty-group {
        flex-direction: column;
    }

    .buttons button {
        width: 80px;
        height: 60px;
        font-size: 30px;
    }

    .choice {
        font-size: 55px;
    }

    .item-list {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="game-container">

<h1>✊ 가위바위보 ✌️</h1>

<!-- 이름 설정 -->

<div id="nameScreen">

    <div class="input-group">
        <input
            type="text"
            id="playerNameInput"
            placeholder="내 이름"
            maxlength="20"
        >
    </div>

    <div class="input-group">
        <input
            type="text"
            id="opponentNameInput"
            placeholder="상대방 이름"
            maxlength="20"
        >
    </div>

    <div class="difficulty-title">
        🎮 난이도 선택
    </div>

    <div class="difficulty-group">

        <div class="difficulty-option">
            <input
                type="radio"
                name="difficulty"
                id="easy"
                value="easy"
                checked
            >
            <label for="easy">
                🟢 쉬움
            </label>
        </div>

        <div class="difficulty-option">
            <input
                type="radio"
                name="difficulty"
                id="normal"
                value="normal"
            >
            <label for="normal">
                🟡 보통
            </label>
        </div>

        <div class="difficulty-option">
            <input
                type="radio"
                name="difficulty"
                id="hard"
                value="hard"
            >
            <label for="hard">
                🔴 어려움
            </label>
        </div>

    </div>

    <button
        id="startButton"
        onclick="startGame()"
    >
        🎮 게임 시작
    </button>

</div>


<!-- 게임 화면 -->

<div id="gameScreen">

    <div
        id="difficultyDisplay"
        class="difficulty-display"
    >
        🟢 쉬움
    </div>

    <div
        id="botStatus"
        class="bot-status inactive"
    >
        🤖 봇 플레이: 꺼짐
    </div>


    <!-- 점수판 -->

    <div class="score-board">

        <div class="score-box">

            <div
                class="score-name"
                id="playerName"
            >
                나
            </div>

            <div
                class="score"
                id="playerScore"
            >
                0
            </div>

        </div>


        <div class="score-box">

            <div
                class="score-name"
                id="opponentName"
            >
                컴퓨터
            </div>

            <div
                class="score"
                id="computerScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- 대결 -->

    <div class="battle">

        <div class="player-area">

            <div
                class="battle-name"
                id="playerNameBattle"
            >
                나
            </div>

            <div
                class="choice"
                id="playerChoice"
            >
                ❔
            </div>

        </div>


        <div class="vs">
            VS
        </div>


        <div class="player-area">

            <div
                class="battle-name"
                id="opponentNameBattle"
            >
                컴퓨터
            </div>

            <div
                class="choice"
                id="computerChoice"
            >
                ❔
            </div>

        </div>

    </div>


    <!-- 봇 생각 -->

    <div id="botThinking"></div>


    <!-- 결과 -->

    <div id="result">
        아래에서 선택하세요!
    </div>


    <!-- 가위바위보 -->

    <div class="buttons">

        <button
            id="rockButton"
            onclick="play('rock')"
            title="바위"
        >
            ✊
        </button>

        <button
            id="paperButton"
            onclick="play('paper')"
            title="보"
        >
            ✋
        </button>

        <button
            id="scissorsButton"
            onclick="play('scissors')"
            title="가위"
        >
            ✌️
        </button>

    </div>


    <!-- 아이템 -->

    <div class="item-section">

        <div class="item-title">
            🎁 아이템
        </div>

        <div class="item-rule">
            <strong>25점</strong> → 🛡️ 방어막 1개<br>
            <strong>50점</strong> → ⚡ 점수 2배 3개<br>
            <strong>75점</strong> → 🍀 행운 5개
        </div>

        <div class="item-list">

            <button
                class="item-card"
                id="shieldItem"
                onclick="useItem('shield')"
            >
                <div class="item-icon">
                    🛡️
                </div>

                <div class="item-name">
                    방어막
                </div>

                <div
                    class="item-count"
                    id="shieldCount"
                >
                    0개
                </div>
            </button>


            <button
                class="item-card"
                id="doubleItem"
                onclick="useItem('double')"
            >
                <div class="item-icon">
                    ⚡
                </div>

                <div class="item-name">
                    점수 2배
                </div>

                <div
                    class="item-count"
                    id="doubleCount"
                >
                    0개
                </div>
            </button>


            <button
                class="item-card"
                id="luckyItem"
                onclick="useItem('lucky')"
            >
                <div class="item-icon">
                    🍀
                </div>

                <div class="item-name">
                    행운
                </div>

                <div
                    class="item-count"
                    id="luckyCount"
                >
                    0개
                </div>
            </button>

        </div>

        <div
            class="active-items"
            id="activeItems"
        ></div>

    </div>


    <!-- 봇 플레이 -->

    <div class="bot-buttons">

        <button
            id="botStart"
            onclick="startBot()"
        >
            🤖 봇 플레이 시작
        </button>

        <button
            id="botStop"
            onclick="stopBot()"
            disabled
        >
            ⏹️ 봇 플레이 중지
        </button>

    </div>


    <!-- 컨트롤 -->

    <div class="control-buttons">

        <button onclick="resetGame()">
            🔄 게임 초기화
        </button>

        <button onclick="changeName()">
            ⚙️ 설정 변경
        </button>

    </div>


    <div class="max-score">
        🏆 먼저 100점을 달성하면 승리합니다.
    </div>

    <div id="gameOver"></div>

</div>

</div>


<!-- 아이템 획득 알림 -->

<div id="itemNotification">

    <div
        class="notification-icon"
        id="notificationIcon"
    ></div>

    <div
        class="notification-title"
        id="notificationTitle"
    ></div>

    <div
        class="notification-text"
        id="notificationText"
    ></div>

</div>


<script>

/* ==========================
   기본 변수
========================== */

let playerScore = 0;
let computerScore = 0;

let playerName = "";
let opponentName = "";

let difficulty = "easy";

let playerHistory = [];


/* ==========================
   봇 변수
========================== */

let botTimer = null;
let botPlaying = false;

let botActionTimer = null;


/* ==========================
   게임 설정
========================== */

const MAX_SCORE = 100;

const BOT_INTERVAL = 3500;


const choices = {

    rock: "✊",

    paper: "✋",

    scissors: "✌️"

};


const difficultyNames = {

    easy: "🟢 쉬움",

    normal: "🟡 보통",

    hard: "🔴 어려움"

};


/* ==========================
   아이템 보상
========================== */

const itemRewards = {

    25: {
        type: "shield",
        amount: 1
    },

    50: {
        type: "double",
        amount: 3
    },

    75: {
        type: "lucky",
        amount: 5
    }

};


/* ==========================
   아이템
========================== */

let items = {

    shield: 0,

    double: 0,

    lucky: 0

};


let activeItems = {

    shield: false,

    double: false,

    lucky: false

};


let earnedRewards = [];


/* ==========================
   아이템 정보
========================== */

const itemInfo = {

    shield: {

        icon: "🛡️",

        name: "방어막",

        description:
            "다음 패배를 1회 막습니다."

    },

    double: {

        icon: "⚡",

        name: "점수 2배",

        description:
            "다음 승리에서 2점을 얻습니다."

    },

    lucky: {

        icon: "🍀",

        name: "행운",

        description:
            "다음 무승부를 승리로 바꿉니다."

    }

};


/* ==========================
   게임 시작
========================== */

function startGame() {

    const playerInput =
        document.getElementById(
            "playerNameInput"
        );

    const opponentInput =
        document.getElementById(
            "opponentNameInput"
        );


    const player =
        playerInput.value.trim();

    const opponent =
        opponentInput.value.trim();


    if (player === "") {

        alert(
            "내 이름을 입력해주세요!"
        );

        playerInput.focus();

        return;

    }


    if (opponent === "") {

        alert(
            "상대방 이름을 입력해주세요!"
        );

        opponentInput.focus();

        return;

    }


    playerName = player;

    opponentName = opponent;


    const selectedDifficulty =
        document.querySelector(
            'input[name="difficulty"]:checked'
        );


    difficulty =
        selectedDifficulty
            ? selectedDifficulty.value
            : "easy";


    playerScore = 0;

    computerScore = 0;

    playerHistory = [];


    resetItems();

    stopBot();


    document.getElementById(
        "playerName"
    ).textContent =
        playerName;


    document.getElementById(
        "playerNameBattle"
    ).textContent =
        playerName;


    document.getElementById(
        "opponentName"
    ).textContent =
        opponentName;


    document.getElementById(
        "opponentNameBattle"
    ).textContent =
        opponentName;


    document.getElementById(
        "difficultyDisplay"
    ).textContent =
        difficultyNames[difficulty];


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "computerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "botThinking"
    ).textContent =
        "";


    enableGameButtons();


    document.getElementById(
        "nameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";

}


/* ==========================
   랜덤 선택
========================== */

function randomChoice(options) {

    return options[
        Math.floor(
            Math.random() *
            options.length
        )
    ];

}


/* ==========================
   카운터 선택
========================== */

function getWinningChoice(choice) {

    if (choice === "rock") {

        return "paper";

    }


    if (choice === "paper") {

        return "scissors";

    }


    return "rock";

}


/* ==========================
   컴퓨터 선택
========================== */

function getComputerChoice() {

    const options = [

        "rock",

        "paper",

        "scissors"

    ];


    if (
        difficulty === "easy"
    ) {

        return randomChoice(options);

    }


    if (
        playerHistory.length === 0
    ) {

        return randomChoice(options);

    }


    /* 보통 */

    if (
        difficulty === "normal"
    ) {

        const lastChoice =
            playerHistory[
                playerHistory.length - 1
            ];


        if (
            Math.random() < 0.6
        ) {

            return randomChoice(
                options
            );

        }


        return getWinningChoice(
            lastChoice
        );

    }


    /* 어려움 */

    if (
        difficulty === "hard"
    ) {

        const counts = {

            rock: 0,

            paper: 0,

            scissors: 0

        };


        playerHistory.forEach(
            function(choice) {

                counts[choice]++;

            }
        );


        let mostUsed = "rock";


        if (
            counts.paper >
            counts[mostUsed]
        ) {

            mostUsed = "paper";

        }


        if (
            counts.scissors >
            counts[mostUsed]
        ) {

            mostUsed = "scissors";

        }


        if (
            Math.random() < 0.8
        ) {

            return getWinningChoice(
                mostUsed
            );

        }


        return randomChoice(
            options
        );

    }


    return randomChoice(options);

}


/* ==========================
   아이템 초기화
========================== */

function resetItems() {

    items = {

        shield: 0,

        double: 0,

        lucky: 0

    };


    activeItems = {

        shield: false,

        double: false,

        lucky: false

    };


    earnedRewards = [];


    updateItems();

}


/* ==========================
   아이템 업데이트
========================== */

function updateItems() {

    document.getElementById(
        "shieldCount"
    ).textContent =
        items.shield + "개";


    document.getElementById(
        "doubleCount"
    ).textContent =
        items.double + "개";


    document.getElementById(
        "luckyCount"
    ).textContent =
        items.lucky + "개";


    const shieldButton =
        document.getElementById(
            "shieldItem"
        );


    const doubleButton =
        document.getElementById(
            "doubleItem"
        );


    const luckyButton =
        document.getElementById(
            "luckyItem"
        );


    shieldButton.disabled =
        items.shield <= 0 ||
        activeItems.shield ||
        playerScore >= MAX_SCORE;


    doubleButton.disabled =
        items.double <= 0 ||
        activeItems.double ||
        playerScore >= MAX_SCORE;


    luckyButton.disabled =
        items.lucky <= 0 ||
        activeItems.lucky ||
        playerScore >= MAX_SCORE;


    shieldButton.classList.toggle(
        "active",
        activeItems.shield
    );


    doubleButton.classList.toggle(
        "active",
        activeItems.double
    );


    luckyButton.classList.toggle(
        "active",
        activeItems.lucky
    );


    updateActiveItems();

}


/* ==========================
   활성 아이템 표시
========================== */

function updateActiveItems() {

    const active = [];


    if (activeItems.shield) {

        active.push(
            "🛡️ 방어막"
        );

    }


    if (activeItems.double) {

        active.push(
            "⚡ 점수 2배"
        );

    }


    if (activeItems.lucky) {

        active.push(
            "🍀 행운"
        );

    }


    const element =
        document.getElementById(
            "activeItems"
        );


    if (active.length === 0) {

        element.textContent = "";

    } else {

        element.textContent =
            "✨ 사용 중: " +
            active.join(" / ");

    }

}


/* ==========================
   아이템 사용
========================== */

function useItem(itemType) {

    if (
        items[itemType] <= 0
    ) {

        return;

    }


    if (
        activeItems[itemType]
    ) {

        return;

    }


    items[itemType]--;


    activeItems[itemType] =
        true;


    updateItems();


    document.getElementById(
        "result"
    ).textContent =
        itemInfo[itemType].icon +
        " " +
        itemInfo[itemType].name +
        " 사용!";

}


/* ==========================
   점수 보상 확인
========================== */

function checkItemRewards() {

    [25, 50, 75].forEach(
        function(score) {

            if (

                playerScore >= score &&

                !earnedRewards.includes(
                    score
                )

            ) {

                earnedRewards.push(
                    score
                );

                giveItemReward(
                    score
                );

            }

        }
    );

}


/* ==========================
   아이템 지급
========================== */

function giveItemReward(score) {

    const reward =
        itemRewards[score];


    items[reward.type] +=
        reward.amount;


    updateItems();


    showItemNotification(
        score,
        reward.type,
        reward.amount
    );

}


/* ==========================
   아이템 획득 알림
========================== */

function showItemNotification(
    score,
    itemType,
    amount
) {

    const notification =
        document.getElementById(
            "itemNotification"
        );


    document.getElementById(
        "notificationIcon"
    ).textContent =
        itemInfo[itemType].icon;


    document.getElementById(
        "notificationTitle"
    ).textContent =
        score +
        "점 달성! 🎉";


    document.getElementById(
        "notificationText"
    ).textContent =
        itemInfo[itemType].name +
        " " +
        amount +
        "개를 획득했습니다!";


    notification.classList.add(
        "show"
    );


    setTimeout(
        function() {

            notification.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* ==========================
   게임 진행
========================== */

function play(player) {

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        stopBot();

        return;

    }


    playerHistory.push(
        player
    );


    const computer =
        getComputerChoice();


    document.getElementById(
        "playerChoice"
    ).textContent =
        choices[player];


    document.getElementById(
        "computerChoice"
    ).textContent =
        choices[computer];


    let result = "";


    /* 무승부 */

    if (
        player === computer
    ) {

        if (
            activeItems.lucky
        ) {

            activeItems.lucky =
                false;


            result =
                "🍀 행운 발동! " +
                "무승부가 승리로 바뀌었습니다!";


            let points = 1;


            if (
                activeItems.double
            ) {

                points = 2;

                activeItems.double =
                    false;


                result +=
                    " ⚡ 점수 2배! +" +
                    points +
                    "점";

            } else {

                result +=
                    " +1점";

            }


            playerScore += points;

        } else {

            result =
                "🤝 무승부!";

        }

    }


    /* 플레이어 승리 */

    else if (

        (
            player === "rock" &&
            computer === "scissors"
        )

        ||

        (
            player === "paper" &&
            computer === "rock"
        )

        ||

        (
            player === "scissors" &&
            computer === "paper"
        )

    ) {

        let points = 1;


        if (
            activeItems.double
        ) {

            points = 2;

            activeItems.double =
                false;


            result =
                "⚡ 점수 2배 발동! +" +
                points +
                "점!";

        } else {

            result =
                "🎉 " +
                playerName +
                "의 승리! +1점";

        }


        playerScore += points;

    }


    /* 컴퓨터 승리 */

    else {

        if (
            activeItems.shield
        ) {

            activeItems.shield =
                false;


            result =
                "🛡️ 방어막 발동! " +
                "패배를 막았습니다!";

        } else {

            computerScore++;


            result =
                "💻 " +
                opponentName +
                "의 승리! +1점";

        }

    }


    updateScore();

    updateItems();

    checkItemRewards();


    document.getElementById(
        "result"
    ).textContent =
        result;


    /* 게임 종료 */

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        disableGameButtons();

        stopBot();


        const gameOver =
            document.getElementById(
                "gameOver"
            );


        if (
            playerScore >= MAX_SCORE
        ) {

            gameOver.textContent =
                "🏆 " +
                playerName +
                " 승리! 최종 점수: " +
                playerScore +
                " : " +
                computerScore;

        } else {

            gameOver.textContent =
                "🤖 " +
                opponentName +
                " 승리! 최종 점수: " +
                playerScore +
                " : " +
                computerScore;

        }


        gameOver.style.display =
            "block";

    }

}


/* ==========================
   점수 업데이트
========================== */

function updateScore() {

    document.getElementById(
        "playerScore"
    ).textContent =
        playerScore;


    document.getElementById(
        "computerScore"
    ).textContent =
        computerScore;

}


/* ==========================
   버튼 비활성화
========================== */

function disableGameButtons() {

    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(
            function(button) {

                button.disabled =
                    true;

            }
        );


    updateItems();

}


/* ==========================
   버튼 활성화
========================== */

function enableGameButtons() {

    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        return;

    }


    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(
            function(button) {

                button.disabled =
                    false;

            }
        );

}


/* ==========================
   봇 시작
========================== */

function startBot() {

    if (botPlaying) {

        return;

    }


    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        return;

    }


    botPlaying = true;


    updateBotStatus();


    botPlay();


    botTimer =
        setInterval(
            botPlay,
            BOT_INTERVAL
        );

}


/* ==========================
   봇 자동 플레이
========================== */

function botPlay() {

    if (!botPlaying) {

        return;

    }


    if (

        playerScore >= MAX_SCORE ||

        computerScore >= MAX_SCORE

    ) {

        stopBot();

        return;

    }


    const options = [

        "rock",

        "paper",

        "scissors"

    ];


    const playerChoice =
        randomChoice(options);


    disableGameButtons();


    /*
        카운트다운 없이
        바로 봇 생각 표시
    */

    document.getElementById(
        "botThinking"
    ).textContent =
        "🤖 봇이 선택하는 중...";


    /*
        잠시 후 선택
    */

    botActionTimer =
        setTimeout(
            function() {

                if (!botPlaying) {

                    return;

                }


                play(
                    playerChoice
                );


                document.getElementById(
                    "botThinking"
                ).textContent =
                    "";


                if (

                    botPlaying &&

                    playerScore <
                        MAX_SCORE &&

                    computerScore <
                        MAX_SCORE

                ) {

                    enableGameButtons();

                }

            },
            1200
        );

}


/* ==========================
   봇 중지
========================== */

function stopBot() {

    botPlaying = false;


    if (
        botTimer !== null
    ) {

        clearInterval(
            botTimer
        );

        botTimer = null;

    }


    if (
        botActionTimer !== null
    ) {

        clearTimeout(
            botActionTimer
        );

        botActionTimer = null;

    }


    document.getElementById(
        "botThinking"
    ).textContent =
        "";


    updateBotStatus();

}


/* ==========================
   봇 상태
========================== */

function updateBotStatus() {

    const status =
        document.getElementById(
            "botStatus"
        );


    const startButton =
        document.getElementById(
            "botStart"
        );


    const stopButton =
        document.getElementById(
            "botStop"
        );


    if (botPlaying) {

        status.textContent =
            "🤖 봇 플레이: 실행 중";


        status.classList.remove(
            "inactive"
        );


        status.classList.add(
            "active"
        );


        startButton.disabled =
            true;


        stopButton.disabled =
            false;

    } else {

        status.textContent =
            "🤖 봇 플레이: 꺼짐";


        status.classList.remove(
            "active"
        );


        status.classList.add(
            "inactive"
        );


        startButton.disabled =
            false;


        stopButton.disabled =
            true;

    }

}


/* ==========================
   게임 초기화
========================== */

function resetGame() {

    stopBot();


    playerScore = 0;

    computerScore = 0;

    playerHistory = [];


    resetItems();


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "computerChoice"
    ).textContent =
        "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    enableGameButtons();

}


/* ==========================
   설정 변경
========================== */

function changeName() {

    stopBot();


    document.getElementById(
        "gameScreen"
    ).style.display =
        "none";


    document.getElementById(
        "nameScreen"
    ).style.display =
        "block";


    document.getElementById(
        "playerNameInput"
    ).value =
        playerName;


    document.getElementById(
        "opponentNameInput"
    ).value =
        opponentName;


    document.getElementById(
        difficulty
    ).checked =
        true;


    document.getElementById(
        "playerNameInput"
    ).focus();

}


/* ==========================
   Enter 키
========================== */

document.getElementById(
    "playerNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startGame();

        }

    }
);


document.getElementById(
    "opponentNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startGame();

        }

    }
);


/* ==========================
   새로고침 초기화
========================== */

window.addEventListener(
    "load",
    function() {

        playerScore = 0;

        computerScore = 0;

        playerName = "";

        opponentName = "";

        difficulty = "easy";

        playerHistory = [];


        resetItems();

        stopBot();


        document.getElementById(
            "playerNameInput"
        ).value =
            "";


        document.getElementById(
            "opponentNameInput"
        ).value =
            "";


        document.getElementById(
            "easy"
        ).checked =
            true;


        document.getElementById(
            "nameScreen"
        ).style.display =
            "block";


        document.getElementById(
            "gameScreen"
        ).style.display =
            "none";


        updateScore();


        document.getElementById(
            "playerChoice"
        ).textContent =
            "❔";


        document.getElementById(
            "computerChoice"
        ).textContent =
            "❔";


        document.getElementById(
            "result"
        ).textContent =
            "아래에서 선택하세요!";


        enableGameButtons();


        document.getElementById(
            "playerNameInput"
        ).focus();

    }
);

</script>

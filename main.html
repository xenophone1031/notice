<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보 게임</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.game {
    width: 90%;
    max-width: 700px;
    background: white;
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
    font-size: 36px;
}

#nameScreen h2 {
    margin-bottom: 25px;
}

.name-input {
    width: 80%;
    padding: 15px;
    margin: 8px 0;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    outline: none;
    text-align: center;
}

.name-input:focus {
    border-color: #667eea;
}

#startButton {
    margin-top: 15px;
    width: 80%;
    background: #667eea;
}

.difficulty-title {
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

.difficulty-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 80%;
    margin: 0 auto;
}

.difficulty-option {
    flex: 1;
}

.difficulty-option input {
    display: none;
}

.difficulty-option label {
    display: block;
    padding: 12px 5px;
    border: 2px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
    color: #555;
}

.difficulty-option label:hover {
    border-color: #667eea;
}

.difficulty-option input:checked + label {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

#gameScreen {
    display: none;
}

.difficulty-display {
    display: inline-block;
    padding: 7px 15px;
    margin-bottom: 10px;
    border-radius: 20px;
    background: #f1f3f5;
    color: #555;
    font-weight: bold;
}

.bot-status {
    margin: 10px auto 15px;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

.bot-status.active {
    background: #e8f5e9;
    color: #2e7d32;
}

.bot-status.inactive {
    background: #f5f5f5;
    color: #777;
}

#botThinking {
    min-height: 24px;
    margin: 5px 0;
    color: #667eea;
    font-weight: bold;
}

.score {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 25px 0;
    font-size: 20px;
}

.score-box {
    background: #f1f3f5;
    padding: 15px 25px;
    border-radius: 15px;
    min-width: 130px;
}

.score-box strong {
    font-size: 38px;
    color: #667eea;
}

.battle {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 30px 0;
}

.player,
.computer {
    font-size: 18px;
    font-weight: bold;
}

.choice {
    font-size: 70px;
    margin-top: 10px;
}

.vs {
    font-size: 25px;
    font-weight: bold;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 25px 0;
}

button {
    border: none;
    border-radius: 15px;
    padding: 15px 20px;
    font-size: 18px;
    cursor: pointer;
    background: #667eea;
    color: white;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    transform: translateY(-4px);
    background: #5568d8;
}

button:active:not(:disabled) {
    transform: scale(0.95);
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

#result {
    font-size: 23px;
    font-weight: bold;
    min-height: 40px;
    line-height: 1.5;
}

.item-section {
    margin-top: 25px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 18px;
    border: 2px solid #eee;
}

.item-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 8px;
}

.item-rule {
    color: #777;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 15px;
}

.item-list {
    display: flex;
    gap: 10px;
}

.item-card {
    flex: 1;
    padding: 12px 5px;
    background: white;
    color: #333;
    border: 2px solid #ddd;
    border-radius: 12px;
}

.item-card:hover:not(:disabled) {
    background: white;
    border-color: #667eea;
}

.item-card.active {
    border-color: #ff8c00;
    background: #fff4e6;
}

.item-icon {
    font-size: 30px;
}

.item-name {
    margin-top: 5px;
    font-size: 14px;
    font-weight: bold;
}

.item-count {
    margin-top: 5px;
    color: #667eea;
    font-size: 14px;
    font-weight: bold;
}

.active-items {
    min-height: 24px;
    margin-top: 12px;
    color: #ff7a00;
    font-size: 14px;
    font-weight: bold;
}

.bot-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.bot-buttons button {
    flex: 1;
}

#botStart {
    background: #4caf50;
}

#botStop {
    background: #f44336;
}

#reset {
    margin-top: 15px;
    background: #343a40;
}

#changeName {
    margin-top: 10px;
    background: #868e96;
}

.max-score {
    margin-top: 15px;
    color: #888;
    font-size: 13px;
}

#gameOver {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: #fff3cd;
    color: #856404;
    font-size: 20px;
    font-weight: bold;
}

/* =========================================
   아이템 알림
========================================= */

#itemNotification {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    width: 320px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 9999;
}

#itemNotification.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.notification-icon {
    font-size: 55px;
}

.notification-title {
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
}

.notification-text {
    margin-top: 8px;
    color: #666;
    line-height: 1.5;
}


/* =========================================
   승패 애니메이션 전체 화면
========================================= */

#endingAnimation {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: none;
    overflow: hidden;
    cursor: pointer;
}

#endingAnimation.show {
    display: block;
}


/* =========================================
   승리 화면
   푸르고 화창한 하늘
========================================= */

#victoryScene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #2196f3 0%,
            #64b5f6 40%,
            #90caf9 68%,
            #d7f1ff 100%
        );
}

#victoryScene::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 28%;
    background:
        linear-gradient(
            to top,
            #72c267,
            #9bdd72
        );
    clip-path: polygon(
        0 45%,
        10% 35%,
        20% 42%,
        30% 28%,
        42% 40%,
        55% 25%,
        68% 40%,
        80% 30%,
        92% 42%,
        100% 28%,
        100% 100%,
        0 100%
    );
}


/* 태양 */

.sun {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #fff176;
    top: 10%;
    right: 13%;
    box-shadow:
        0 0 35px #fff59d,
        0 0 80px #fff59d,
        0 0 130px rgba(255,241,118,0.55);
    animation: sunGlow 2.5s ease-in-out infinite alternate;
}

@keyframes sunGlow {
    from {
        transform: scale(1);
        box-shadow:
            0 0 35px #fff59d,
            0 0 70px #fff59d;
    }

    to {
        transform: scale(1.08);
        box-shadow:
            0 0 50px #fff59d,
            0 0 110px #fff59d,
            0 0 160px rgba(255,241,118,0.5);
    }
}


/* 구름 */

.cloud {
    position: absolute;
    width: 210px;
    height: 60px;
    background: rgba(255,255,255,0.92);
    border-radius: 60px;
    filter: blur(1px);
    box-shadow: 0 8px 15px rgba(0,0,0,0.08);
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.95);
    border-radius: 50%;
}

.cloud::before {
    width: 90px;
    height: 90px;
    left: 30px;
    bottom: 15px;
}

.cloud::after {
    width: 110px;
    height: 110px;
    right: 25px;
    bottom: 10px;
}

.cloud1 {
    top: 18%;
    left: -250px;
    transform: scale(0.9);
    animation: cloudMove1 28s linear infinite;
}

.cloud2 {
    top: 36%;
    left: -300px;
    transform: scale(0.65);
    animation: cloudMove2 35s linear infinite;
    animation-delay: 5s;
}

.cloud3 {
    top: 54%;
    left: -350px;
    transform: scale(0.75);
    animation: cloudMove3 42s linear infinite;
    animation-delay: 10s;
}

@keyframes cloudMove1 {
    from {
        left: -300px;
    }
    to {
        left: 110%;
    }
}

@keyframes cloudMove2 {
    from {
        left: -350px;
    }
    to {
        left: 110%;
    }
}

@keyframes cloudMove3 {
    from {
        left: -400px;
    }
    to {
        left: 110%;
    }
}


/* 승리 메시지 */

.victory-message {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    text-shadow:
        0 3px 10px rgba(0,0,0,0.25),
        0 0 25px rgba(255,255,255,0.5);
    animation: victoryAppear 1.2s ease-out forwards;
}

.victory-message .trophy {
    font-size: 90px;
    animation: trophyBounce 1.5s ease-in-out infinite;
}

.victory-score {
    margin-top: 15px;
    font-size: 30px;
    font-weight: bold;
}

.victory-hint {
    margin-top: 25px;
    font-size: 15px;
    opacity: 0.9;
}

@keyframes victoryAppear {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes trophyBounce {
    0%, 100% {
        transform: translateY(0) rotate(-3deg);
    }

    50% {
        transform: translateY(-18px) rotate(3deg);
    }
}


/* =========================================
   패배 화면
   붉고 어두운 분위기
========================================= */

#defeatScene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            #661313 0%,
            #360808 40%,
            #170202 75%,
            #050000 100%
        );
}

#defeatScene::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 10%,
            rgba(0,0,0,0.45) 65%,
            rgba(0,0,0,0.9) 100%
        );
    z-index: 3;
    pointer-events: none;
}


/* 붉은 달 */

.blood-moon {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    top: 12%;
    right: 17%;
    background:
        radial-gradient(
            circle at 35% 35%,
            #ff5555,
            #a40000 60%,
            #420000 100%
        );
    box-shadow:
        0 0 30px rgba(255,0,0,0.5),
        0 0 80px rgba(180,0,0,0.4);
    animation: moonPulse 3s ease-in-out infinite alternate;
}

@keyframes moonPulse {
    from {
        opacity: 0.65;
        transform: scale(1);
    }

    to {
        opacity: 1;
        transform: scale(1.05);
    }
}


/* 어두운 구름 */

.dark-cloud {
    position: absolute;
    width: 330px;
    height: 85px;
    border-radius: 80px;
    background:
        linear-gradient(
            to bottom,
            #280707,
            #100101
        );
    filter: blur(2px);
    opacity: 0.9;
}

.dark-cloud::before,
.dark-cloud::after {
    content: "";
    position: absolute;
    background: #180202;
    border-radius: 50%;
}

.dark-cloud::before {
    width: 140px;
    height: 140px;
    left: 40px;
    bottom: 10px;
}

.dark-cloud::after {
    width: 170px;
    height: 170px;
    right: 30px;
    bottom: 0;
}

.dark-cloud1 {
    top: 12%;
    left: -380px;
    animation: darkCloudMove1 24s linear infinite;
}

.dark-cloud2 {
    top: 32%;
    left: -450px;
    transform: scale(0.75);
    animation: darkCloudMove2 30s linear infinite;
    animation-delay: 4s;
}

.dark-cloud3 {
    top: 50%;
    left: -500px;
    transform: scale(1.1);
    animation: darkCloudMove3 36s linear infinite;
    animation-delay: 8s;
}

@keyframes darkCloudMove1 {
    from {
        left: -400px;
    }
    to {
        left: 110%;
    }
}

@keyframes darkCloudMove2 {
    from {
        left: -500px;
    }
    to {
        left: 110%;
    }
}

@keyframes darkCloudMove3 {
    from {
        left: -550px;
    }
    to {
        left: 110%;
    }
}


/* 비 */

.rain {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.25;
    background-image:
        repeating-linear-gradient(
            105deg,
            transparent 0px,
            transparent 20px,
            rgba(255,80,80,0.45) 21px,
            rgba(255,80,80,0.45) 22px,
            transparent 23px,
            transparent 55px
        );
    background-size: 90px 120px;
    animation: rainMove 0.7s linear infinite;
}

@keyframes rainMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: -90px 120px;
    }
}


/* funeral */

.funeral-text {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    z-index: 10;
    color: rgba(255, 190, 190, 0.75);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 5px;
    text-transform: lowercase;
    text-shadow:
        0 2px 8px rgba(0,0,0,0.8);
    animation: funeralFade 3s ease-in-out infinite alternate;
}

@keyframes funeralFade {
    from {
        opacity: 0.45;
    }

    to {
        opacity: 0.85;
    }
}


/* 패배 화면 하단 힌트 */

.defeat-hint {
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(255,255,255,0.45);
    font-size: 13px;
}


/* =========================================
   반응형
========================================= */

@media(max-width: 500px) {

    .game {
        padding: 20px;
    }

    .difficulty-group {
        flex-direction: column;
    }

    .choice {
        font-size: 55px;
    }

    .score {
        gap: 10px;
    }

    .score-box {
        min-width: 110px;
        padding: 12px;
    }

    .item-list {
        flex-direction: column;
    }

    .buttons button {
        padding: 12px;
        font-size: 16px;
    }

    .sun {
        width: 100px;
        height: 100px;
        right: 8%;
    }

    .blood-moon {
        width: 110px;
        height: 110px;
        right: 8%;
    }

    .victory-message .trophy {
        font-size: 70px;
    }

    .victory-score {
        font-size: 23px;
    }

    .funeral-text {
        font-size: 17px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- ==============================
         이름 설정 화면
    =============================== -->

    <div id="nameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <h2>게임 이름 설정</h2>

        <input
            type="text"
            id="playerNameInput"
            class="name-input"
            placeholder="내 이름"
            maxlength="20"
        >

        <br>

        <input
            type="text"
            id="opponentNameInput"
            class="name-input"
            placeholder="상대방 이름"
            maxlength="20"
        >

        <br>

        <div class="difficulty-title">
            🎮 난이도 선택
        </div>

        <div class="difficulty-group">

            <div class="difficulty-option">
                <input
                    type="radio"
                    name="difficulty"
                    id="easy"
                    value="easy"
                    checked
                >
                <label for="easy">🟢 쉬움</label>
            </div>

            <div class="difficulty-option">
                <input
                    type="radio"
                    name="difficulty"
                    id="normal"
                    value="normal"
                >
                <label for="normal">🟡 보통</label>
            </div>

            <div class="difficulty-option">
                <input
                    type="radio"
                    name="difficulty"
                    id="hard"
                    value="hard"
                >
                <label for="hard">🔴 어려움</label>
            </div>

        </div>

        <button id="startButton" onclick="startGame()">
            🎮 게임 시작
        </button>

    </div>


    <!-- ==============================
         게임 화면
    =============================== -->

    <div id="gameScreen">

        <h1>✊ 가위바위보 ✌️</h1>

        <div
            id="difficultyDisplay"
            class="difficulty-display"
        >
            🟢 쉬움
        </div>

        <div
            id="botStatus"
            class="bot-status inactive"
        >
            🤖 봇 플레이: 꺼짐
        </div>


        <div class="score">

            <div class="score-box">
                <span id="playerName">
                    플레이어
                </span>

                <br>

                <strong id="playerScore">
                    0
                </strong>
            </div>


            <div class="score-box">
                <span id="opponentName">
                    컴퓨터
                </span>

                <br>

                <strong id="computerScore">
                    0
                </strong>
            </div>

        </div>


        <div class="battle">

            <div class="player">

                <div id="playerNameBattle">
                    플레이어
                </div>

                <div
                    class="choice"
                    id="playerChoice"
                >
                    ❔
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="computer">

                <div id="opponentNameBattle">
                    컴퓨터
                </div>

                <div
                    class="choice"
                    id="computerChoice"
                >
                    ❔
                </div>

            </div>

        </div>


        <div id="botThinking"></div>


        <div id="result">
            아래에서 선택하세요!
        </div>


        <div class="buttons">

            <button onclick="play('rock')">
                ✊ 바위
            </button>

            <button onclick="play('paper')">
                ✋ 보
            </button>

            <button onclick="play('scissors')">
                ✌️ 가위
            </button>

        </div>


        <!-- ==============================
             아이템
        =============================== -->

        <div class="item-section">

            <div class="item-title">
                🎁 아이템
            </div>

            <div class="item-rule">

                <strong>25점 / 50점 / 75점</strong>
                달성 시
                <strong>
                    아이템 종류와 개수가 랜덤
                </strong>
                으로 지급됩니다.

                <br>

                아이템 개수는
                <strong>1~5개</strong>
                중 랜덤으로 결정됩니다.

            </div>


            <div class="item-list">

                <button
                    class="item-card"
                    id="shieldItem"
                    onclick="useItem('shield')"
                >

                    <div class="item-icon">
                        🛡️
                    </div>

                    <div class="item-name">
                        방어막
                    </div>

                    <div
                        class="item-count"
                        id="shieldCount"
                    >
                        0개
                    </div>

                </button>


                <button
                    class="item-card"
                    id="doubleItem"
                    onclick="useItem('double')"
                >

                    <div class="item-icon">
                        ⚡
                    </div>

                    <div class="item-name">
                        점수 2배
                    </div>

                    <div
                        class="item-count"
                        id="doubleCount"
                    >
                        0개
                    </div>

                </button>


                <button
                    class="item-card"
                    id="luckyItem"
                    onclick="useItem('lucky')"
                >

                    <div class="item-icon">
                        🍀
                    </div>

                    <div class="item-name">
                        행운
                    </div>

                    <div
                        class="item-count"
                        id="luckyCount"
                    >
                        0개
                    </div>

                </button>

            </div>


            <div
                class="active-items"
                id="activeItems"
            ></div>

        </div>


        <!-- 봇 -->

        <div class="bot-buttons">

            <button
                id="botStart"
                onclick="startBot()"
            >
                🤖 봇 플레이 시작
            </button>

            <button
                id="botStop"
                onclick="stopBot()"
                disabled
            >
                ⏹️ 봇 플레이 중지
            </button>

        </div>


        <button
            id="reset"
            onclick="resetGame()"
        >
            🔄 게임 초기화
        </button>

        <br>

        <button
            id="changeName"
            onclick="changeName()"
        >
            ✏️ 이름 변경
        </button>


        <div class="max-score">
            🏆 먼저 100점을 달성하면 승리합니다.
        </div>


        <div id="gameOver"></div>

    </div>

</div>


<!-- ==============================
     아이템 획득 알림
=============================== -->

<div id="itemNotification">

    <div
        class="notification-icon"
        id="notificationIcon"
    ></div>

    <div
        class="notification-title"
        id="notificationTitle"
    ></div>

    <div
        class="notification-text"
        id="notificationText"
    ></div>

</div>


<!-- =================================================
     승패 애니메이션
================================================= -->

<div id="endingAnimation">

    <!-- 승리 -->

    <div
        id="victoryScene"
        style="display:none;"
    >

        <div class="sun"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="victory-message">

            <div class="trophy">
                🏆
            </div>

            <div
                class="victory-score"
                id="victoryScore"
            ></div>

            <div class="victory-hint">
                화면을 클릭하면 게임으로 돌아갑니다
            </div>

        </div>

    </div>


    <!-- 패배 -->

    <div
        id="defeatScene"
        style="display:none;"
    >

        <div class="blood-moon"></div>

        <div class="dark-cloud dark-cloud1"></div>
        <div class="dark-cloud dark-cloud2"></div>
        <div class="dark-cloud dark-cloud3"></div>

        <div class="rain"></div>

        <div class="funeral-text">
            funeral
        </div>

        <div class="defeat-hint">
            화면을 클릭하면 게임으로 돌아갑니다
        </div>

    </div>

</div>


<script>

/* =========================================
   기본 게임 변수
========================================= */

let playerScore = 0;
let computerScore = 0;

let playerName = "";
let opponentName = "";

let difficulty = "easy";

let playerHistory = [];

const MAX_SCORE = 100;

const BOT_INTERVAL = 3500;
const BOT_THINK_TIME = 1200;


const choices = {
    rock: "✊",
    paper: "✋",
    scissors: "✌️"
};


const difficultyNames = {
    easy: "🟢 쉬움",
    normal: "🟡 보통",
    hard: "🔴 어려움"
};


let botTimer = null;
let botActionTimer = null;
let botPlaying = false;


/* =========================================
   아이템
========================================= */

let items = {
    shield: 0,
    double: 0,
    lucky: 0
};


let activeItems = {
    shield: false,
    double: false,
    lucky: false
};


let earnedRewards = [];


const itemInfo = {

    shield: {
        icon: "🛡️",
        name: "방어막",
        description: "다음 패배를 1회 막습니다."
    },

    double: {
        icon: "⚡",
        name: "점수 2배",
        description: "다음 승리에서 2점을 얻습니다."
    },

    lucky: {
        icon: "🍀",
        name: "행운",
        description: "다음 무승부를 승리로 바꿉니다."
    }

};


/* =========================================
   랜덤 선택
========================================= */

function randomChoice(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =========================================
   게임 시작
========================================= */

function startGame() {

    const playerInput =
        document.getElementById(
            "playerNameInput"
        );

    const opponentInput =
        document.getElementById(
            "opponentNameInput"
        );


    const player =
        playerInput.value.trim();

    const opponent =
        opponentInput.value.trim();


    if (player === "") {

        alert("내 이름을 입력해주세요!");

        playerInput.focus();

        return;
    }


    if (opponent === "") {

        alert("상대방 이름을 입력해주세요!");

        opponentInput.focus();

        return;
    }


    playerName = player;

    opponentName = opponent;


    const selectedDifficulty =
        document.querySelector(
            'input[name="difficulty"]:checked'
        );


    difficulty =
        selectedDifficulty
            ? selectedDifficulty.value
            : "easy";


    playerScore = 0;
    computerScore = 0;

    playerHistory = [];


    resetItems();

    stopBot();


    document.getElementById(
        "playerName"
    ).textContent = playerName;

    document.getElementById(
        "playerNameBattle"
    ).textContent = playerName;


    document.getElementById(
        "opponentName"
    ).textContent = opponentName;

    document.getElementById(
        "opponentNameBattle"
    ).textContent = opponentName;


    document.getElementById(
        "difficultyDisplay"
    ).textContent =
        difficultyNames[difficulty];


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent = "❔";

    document.getElementById(
        "computerChoice"
    ).textContent = "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display = "none";


    document.getElementById(
        "botThinking"
    ).textContent = "";


    enableGameButtons();


    document.getElementById(
        "nameScreen"
    ).style.display = "none";


    document.getElementById(
        "gameScreen"
    ).style.display = "block";

}


/* =========================================
   아이템 초기화
========================================= */

function resetItems() {

    items = {
        shield: 0,
        double: 0,
        lucky: 0
    };


    activeItems = {
        shield: false,
        double: false,
        lucky: false
    };


    earnedRewards = [];


    updateItems();

}


/* =========================================
   아이템 표시
========================================= */

function updateItems() {

    document.getElementById(
        "shieldCount"
    ).textContent =
        items.shield + "개";


    document.getElementById(
        "doubleCount"
    ).textContent =
        items.double + "개";


    document.getElementById(
        "luckyCount"
    ).textContent =
        items.lucky + "개";


    const shieldButton =
        document.getElementById(
            "shieldItem"
        );

    const doubleButton =
        document.getElementById(
            "doubleItem"
        );

    const luckyButton =
        document.getElementById(
            "luckyItem"
        );


    shieldButton.disabled =
        items.shield <= 0 ||
        activeItems.shield;


    doubleButton.disabled =
        items.double <= 0 ||
        activeItems.double;


    luckyButton.disabled =
        items.lucky <= 0 ||
        activeItems.lucky;


    shieldButton.classList.toggle(
        "active",
        activeItems.shield
    );


    doubleButton.classList.toggle(
        "active",
        activeItems.double
    );


    luckyButton.classList.toggle(
        "active",
        activeItems.lucky
    );


    updateActiveItems();

}


/* =========================================
   활성화된 아이템
========================================= */

function updateActiveItems() {

    const active = [];


    if (activeItems.shield) {

        active.push("🛡️ 방어막");

    }


    if (activeItems.double) {

        active.push("⚡ 점수 2배");

    }


    if (activeItems.lucky) {

        active.push("🍀 행운");

    }


    document.getElementById(
        "activeItems"
    ).textContent =

        active.length > 0

            ? "✨ 사용 중: " +
              active.join(" / ")

            : "";

}


/* =========================================
   아이템 사용
========================================= */

function useItem(itemType) {

    if (items[itemType] <= 0) {
        return;
    }


    if (activeItems[itemType]) {
        return;
    }


    items[itemType]--;

    activeItems[itemType] = true;


    updateItems();


    document.getElementById(
        "result"
    ).textContent =

        itemInfo[itemType].icon +
        " " +
        itemInfo[itemType].name +
        " 사용!";

}


/* =========================================
   아이템 보상 체크
========================================= */

function checkItemRewards() {

    const milestones = [
        25,
        50,
        75
    ];


    milestones.forEach(function(score) {

        if (
            playerScore >= score &&
            !earnedRewards.includes(score)
        ) {

            earnedRewards.push(score);

            giveRandomItemReward(score);

        }

    });

}


/* =========================================
   랜덤 아이템 지급
========================================= */

function giveRandomItemReward(score) {

    const itemTypes = [
        "shield",
        "double",
        "lucky"
    ];


    const randomItem =
        randomChoice(itemTypes);


    const randomAmount =
        Math.floor(
            Math.random() * 5
        ) + 1;


    items[randomItem] += randomAmount;


    updateItems();


    showItemNotification(
        score,
        randomItem,
        randomAmount
    );

}


/* =========================================
   아이템 알림
========================================= */

function showItemNotification(
    score,
    itemType,
    amount
) {

    const notification =
        document.getElementById(
            "itemNotification"
        );


    document.getElementById(
        "notificationIcon"
    ).textContent =
        itemInfo[itemType].icon;


    document.getElementById(
        "notificationTitle"
    ).textContent =
        score + "점 달성! 🎉";


    document.getElementById(
        "notificationText"
    ).textContent =

        itemInfo[itemType].name +
        " " +
        amount +
        "개를 획득했습니다!";


    notification.classList.add("show");


    setTimeout(function() {

        notification.classList.remove("show");

    }, 2500);

}


/* =========================================
   컴퓨터가 이길 수 있는 선택
========================================= */

function getWinningChoice(choice) {

    if (choice === "rock") {
        return "paper";
    }


    if (choice === "paper") {
        return "scissors";
    }


    return "rock";

}


/* =========================================
   컴퓨터 선택
========================================= */

function getComputerChoice() {

    const options = [
        "rock",
        "paper",
        "scissors"
    ];


    /* 쉬움 */

    if (difficulty === "easy") {

        return randomChoice(options);

    }


    if (playerHistory.length === 0) {

        return randomChoice(options);

    }


    /* 보통 */

    if (difficulty === "normal") {

        const lastChoice =
            playerHistory[
                playerHistory.length - 1
            ];


        if (Math.random() < 0.6) {

            return randomChoice(options);

        }


        return getWinningChoice(
            lastChoice
        );

    }


    /* 어려움 */

    if (difficulty === "hard") {

        const counts = {

            rock: 0,
            paper: 0,
            scissors: 0

        };


        playerHistory.forEach(
            function(choice) {

                counts[choice]++;

            }
        );


        let mostUsed = "rock";


        if (
            counts.paper >
            counts[mostUsed]
        ) {

            mostUsed = "paper";

        }


        if (
            counts.scissors >
            counts[mostUsed]
        ) {

            mostUsed = "scissors";

        }


        if (Math.random() < 0.8) {

            return getWinningChoice(
                mostUsed
            );

        }


        return randomChoice(options);

    }


    return randomChoice(options);

}


/* =========================================
   가위바위보 플레이
========================================= */

function play(player) {

    if (
        playerScore >= MAX_SCORE ||
        computerScore >= MAX_SCORE
    ) {

        stopBot();

        return;
    }


    playerHistory.push(player);


    const computer =
        getComputerChoice();


    document.getElementById(
        "playerChoice"
    ).textContent =
        choices[player];


    document.getElementById(
        "computerChoice"
    ).textContent =
        choices[computer];


    let result = "";


    /* =====================================
       무승부
    ===================================== */

    if (player === computer) {

        if (activeItems.lucky) {

            activeItems.lucky = false;


            let points = 1;


            if (activeItems.double) {

                points = 2;

                activeItems.double = false;


                result =
                    "🍀 행운 발동! " +
                    "⚡ 점수 2배 발동! " +
                    "+2점!";

            } else {

                result =
                    "🍀 행운 발동! " +
                    "무승부가 승리로 바뀌었습니다! +1점!";

            }


            playerScore += points;

        } else {

            result =
                "🤝 무승부!";

        }

    }


    /* =====================================
       플레이어 승리
    ===================================== */

    else if (

        (
            player === "rock" &&
            computer === "scissors"
        )

        ||

        (
            player === "paper" &&
            computer === "rock"
        )

        ||

        (
            player === "scissors" &&
            computer === "paper"
        )

    ) {

        let points = 1;


        if (activeItems.double) {

            points = 2;

            activeItems.double = false;


            result =
                "⚡ 점수 2배 발동! +" +
                points +
                "점!";

        } else {

            result =
                "🎉 " +
                playerName +
                "의 승리! +1점!";

        }


        playerScore += points;

    }


    /* =====================================
       컴퓨터 승리
    ===================================== */

    else {

        if (activeItems.shield) {

            activeItems.shield = false;


            result =
                "🛡️ 방어막 발동! " +
                "패배를 막았습니다!";

        } else {

            computerScore++;


            result =
                "🎉 " +
                opponentName +
                "의 승리! +1점!";

        }

    }


    updateScore();

    updateItems();

    checkItemRewards();


    document.getElementById(
        "result"
    ).textContent = result;


    /* =====================================
       게임 종료
    ===================================== */

    if (
        playerScore >= MAX_SCORE ||
        computerScore >= MAX_SCORE
    ) {

        disableGameButtons();

        stopBot();


        /*
         * 기존 gameOver 텍스트는 사용하지 않고
         * 승패 애니메이션을 바로 실행
         */

        if (
            playerScore >= MAX_SCORE
        ) {

            showEndingAnimation(
                "win"
            );

        } else {

            showEndingAnimation(
                "lose"
            );

        }

    }

}


/* =========================================
   점수 업데이트
========================================= */

function updateScore() {

    document.getElementById(
        "playerScore"
    ).textContent =
        playerScore;


    document.getElementById(
        "computerScore"
    ).textContent =
        computerScore;

}


/* =========================================
   게임 버튼 비활성화
========================================= */

function disableGameButtons() {

    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(function(button) {

            button.disabled = true;

        });


    updateItems();

}


/* =========================================
   게임 버튼 활성화
========================================= */

function enableGameButtons() {

    if (
        playerScore >= MAX_SCORE ||
        computerScore >= MAX_SCORE
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".buttons button"
        )
        .forEach(function(button) {

            button.disabled = false;

        });

}


/* =========================================
   봇 시작
========================================= */

function startBot() {

    if (botPlaying) {
        return;
    }


    if (
        playerScore >= MAX_SCORE ||
        computerScore >= MAX_SCORE
    ) {

        return;

    }


    botPlaying = true;


    updateBotStatus();


    botPlay();


    botTimer =
        setInterval(
            botPlay,
            BOT_INTERVAL
        );

}


/* =========================================
   봇 플레이
========================================= */

function botPlay() {

    if (!botPlaying) {
        return;
    }


    if (
        playerScore >= MAX_SCORE ||
        computerScore >= MAX_SCORE
    ) {

        stopBot();

        return;

    }


    const options = [
        "rock",
        "paper",
        "scissors"
    ];


    const playerChoice =
        randomChoice(options);


    disableGameButtons();

    botActionTimer =
        setTimeout(function() {

            if (!botPlaying) {
                return;
            }


            play(playerChoice);


            document.getElementById(
                "botThinking"
            ).textContent = "";


            if (
                botPlaying &&
                playerScore < MAX_SCORE &&
                computerScore < MAX_SCORE
            ) {

                enableGameButtons();

            }

        }, BOT_THINK_TIME);

}


/* =========================================
   봇 중지
========================================= */

function stopBot() {

    botPlaying = false;


    if (botTimer !== null) {

        clearInterval(botTimer);

        botTimer = null;

    }


    if (botActionTimer !== null) {

        clearTimeout(botActionTimer);

        botActionTimer = null;

    }


    document.getElementById(
        "botThinking"
    ).textContent = "";


    updateBotStatus();

}


/* =========================================
   봇 상태 표시
========================================= */

function updateBotStatus() {

    const status =
        document.getElementById(
            "botStatus"
        );


    const startButton =
        document.getElementById(
            "botStart"
        );


    const stopButton =
        document.getElementById(
            "botStop"
        );


    if (botPlaying) {

        status.textContent =
            "🤖 봇 플레이: 켜짐";


        status.classList.remove(
            "inactive"
        );

        status.classList.add(
            "active"
        );


        startButton.disabled = true;

        stopButton.disabled = false;

    } else {

        status.textContent =
            "🤖 봇 플레이: 꺼짐";


        status.classList.remove(
            "active"
        );

        status.classList.add(
            "inactive"
        );


        startButton.disabled = false;

        stopButton.disabled = true;

    }

}


/* =========================================
   게임 초기화
========================================= */

function resetGame() {

    stopBot();


    playerScore = 0;

    computerScore = 0;

    playerHistory = [];


    resetItems();


    updateScore();


    document.getElementById(
        "playerChoice"
    ).textContent = "❔";


    document.getElementById(
        "computerChoice"
    ).textContent = "❔";


    document.getElementById(
        "result"
    ).textContent =
        "아래에서 선택하세요!";


    document.getElementById(
        "gameOver"
    ).style.display = "none";


    enableGameButtons();

}


/* =========================================
   이름 변경
========================================= */

function changeName() {

    stopBot();


    document.getElementById(
        "gameScreen"
    ).style.display = "none";


    document.getElementById(
        "nameScreen"
    ).style.display = "block";


    document.getElementById(
        "playerNameInput"
    ).value = playerName;


    document.getElementById(
        "opponentNameInput"
    ).value = opponentName;


    document.getElementById(
        difficulty
    ).checked = true;


    document.getElementById(
        "playerNameInput"
    ).focus();

}


/* =========================================
   승패 애니메이션 표시
========================================= */

function showEndingAnimation(type) {

    const ending =
        document.getElementById(
            "endingAnimation"
        );


    const victory =
        document.getElementById(
            "victoryScene"
        );


    const defeat =
        document.getElementById(
            "defeatScene"
        );


    victory.style.display = "none";

    defeat.style.display = "none";


    if (type === "win") {

        victory.style.display = "block";


        document.getElementById(
            "victoryScore"
        ).textContent =

            playerName +
            "  " +
            playerScore +
            " : " +
            computerScore;


    } else {

        defeat.style.display = "block";

    }


    ending.classList.add("show");

}


/* =========================================
   승패 애니메이션 종료
   화면 클릭
========================================= */

document.getElementById(
    "endingAnimation"
).addEventListener(
    "click",
    function() {

        this.classList.remove("show");


        document.getElementById(
            "victoryScene"
        ).style.display = "none";


        document.getElementById(
            "defeatScene"
        ).style.display = "none";

    }
);


/* =========================================
   Enter 키
========================================= */

document.getElementById(
    "playerNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            startGame();

        }

    }
);


document.getElementById(
    "opponentNameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            startGame();

        }

    }
);


/* =========================================
   페이지 로드
========================================= */

window.addEventListener(
    "load",
    function() {

        playerScore = 0;

        computerScore = 0;

        playerName = "";

        opponentName = "";

        difficulty = "easy";

        playerHistory = [];


        resetItems();

        stopBot();


        document.getElementById(
            "nameScreen"
        ).style.display = "block";


        document.getElementById(
            "gameScreen"
        ).style.display = "none";


        document.getElementById(
            "endingAnimation"
        ).classList.remove("show");


        document.getElementById(
            "playerNameInput"
        ).value = "";


        document.getElementById(
            "opponentNameInput"
        ).value = "";


        document.getElementById(
            "easy"
        ).checked = true;


        updateScore();

    }
);

</script>

</body>
</html>
